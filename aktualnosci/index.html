<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktualności - Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060606;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animowane tło */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #040404, #0f0f0f, #1a1402);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Górny pasek nawigacyjny z efektem szkła */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* Menu hamburgerowe */
        .menu-dropdown {
            position: relative;
            display: inline-block;
        }

        .menu-toggle-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .menu-toggle-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .side-menu-dropdown {
            position: absolute;
            left: 0;
            top: calc(100% + 12px);
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 12px 0;
            min-width: 260px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown {
            left: auto;
            right: 0;
        }

        .menu-dropdown:hover .side-menu-dropdown,
        .side-menu-dropdown:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .side-menu-dropdown li {
            position: relative;
        }

        .side-menu-dropdown li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 22px;
            color: #dddddd;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        html[dir="rtl"] .side-menu-dropdown li a {
            border-left: none;
            border-right: 3px solid transparent;
        }

        .side-menu-dropdown li a:hover {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
            border-left-color: #ffd700;
            padding-left: 26px;
        }

        html[dir="rtl"] .side-menu-dropdown li a:hover {
            border-right-color: #ffd700;
            padding-left: 22px;
            padding-right: 26px;
        }

        .side-menu-dropdown li a::after {
            content: '›';
            font-size: 1.2rem;
            color: #666;
            transition: color 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown li a::after {
            content: '‹';
        }

        .side-menu-dropdown li a:hover::after {
            color: #ffd700;
        }

        /* Podmenu dla zakładki Klub */
        .submenu-club {
            position: absolute;
            left: 100%;
            top: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 10px 0;
            min-width: 200px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateX(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        html[dir="rtl"] .submenu-club {
            left: auto;
            right: 100%;
            transform: translateX(-10px);
        }

        .has-submenu:hover .submenu-club {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        /* Logo kierujące na główną */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-container img {
            height: 50px;
            width: auto;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        /* Przełącznik języków */
        .lang-dropdown {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .lang-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            list-style: none;
            padding: 8px 0;
            min-width: 150px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.25s;
        }

        .lang-dropdown:hover .lang-menu,
        .lang-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .lang-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: #cccccc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .lang-menu li a:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        /* Główna treść strony – Aktualności */
        main {
            margin-top: 130px;
            padding: 20px 5% 80px 5%;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 2px 15px rgba(255, 215, 0, 0.25);
        }

        /* Panel sortowania i tagów na górze */
        .filter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }

        .filter-btn {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #cccccc;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border-color: #ffd700;
        }

        /* Siatka aktualności */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Kafelki newsów z efektem szkła */
        .news-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.7), rgba(10, 10, 10, 0.8));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .news-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 215, 0, 0.45);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .news-card:hover::before {
            opacity: 1;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .news-date {
            font-size: 0.8rem;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .news-tag {
            font-size: 0.75rem;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            text-transform: uppercase;
            font-weight: 600;
        }

        .news-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .news-desc {
            font-size: 0.95rem;
            color: #aaaaaa;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .news-btn {
            align-self: flex-start;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .news-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            border-color: #ffd700;
        }

        /* Modal / Okno wyskakujące dla artykułu */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .modal-date {
            font-size: 0.85rem;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .modal-body {
            font-size: 1.05rem;
            color: #cccccc;
            line-height: 1.8;
        }
    </style>
</head>

                articles: {
                    "news-1": { title: "التحضيرات للموسم الجديد تبدأ قريباً!", desc: "الفريق يتدرب بشكل مكثف استعداداً للمباريات القادمة في الدوري. تحقق من جدول المباريات.", body: "الفريق يتدرب بشكل مكثف استعداداً للمباريات القادمة في الدوري. خطط الجهاز الفني لسلسلة من المباريات الودية." },
                    "news-2": { title: "ملخص مباراتنا الأخيرة في الدوري", desc: "مواجهة مثيرة مليئة بالتقلبات. شاهد الأهداف والفرص التهديفية الحاسمة.", body: "مواجهة مثيرة مليئة بالتقلبات حتى الدقائق الأخيرة. أظهر الفريق شخصية عظيمة على أرض الملعب." }
                }
            }
        };

        let currentLang = 'pl';
        let currentFilter = 'all';

        const defaultNews = [
            { id: "news-1", tag: "mecz", date: "2026-03-15", displayDate: "15.03.2026" },
            { id: "news-2", tag: "klub", date: "2026-03-10", displayDate: "10.03.2026" }
        ];

        function renderNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            let savedNews = JSON.parse(localStorage.getItem('legion_news')) || defaultNews;
            savedNews.sort((a, b) => new Date(b.date) - new Date(a.date));

            const langData = translations[currentLang] || translations['pl'];
            const tArticles = langData.articles || {};
            const tTags = langData.tags || {};
            const readMoreText = langData.read_more || "Czytaj dalej ›";

            savedNews.forEach(item => {
                if (currentFilter !== 'all' && item.tag !== currentFilter) {
                    return;
                }

                // Pobieranie tłumaczenia dla konkretnego artykułu (lub użycie zapisanego, jeśli dodany z panelu)
                const articleTranslation = tArticles[item.id] || {};
                const title = articleTranslation.title || item.title || "Artykuł";
                const desc = articleTranslation.desc || item.desc || "";
                const body = articleTranslation.body || item.body || desc;
                const tagLabel = tTags[item.tag] || item.tag;

                const card = document.createElement('div');
                card.className = 'news-card';
                card.id = item.id;
                card.setAttribute('data-tag', item.tag);
                card.setAttribute('data-date', item.date);

                card.innerHTML = `
                    <div class="news-meta">
                        <span class="news-date">${item.displayDate || item.date}</span>
                        <span class="news-tag">${tagLabel}</span>
                    </div>
                    <div class="news-title">${title}</div>
                    <div class="news-desc">${desc}</div>
                    <button class="news-btn" onclick="openModal('${escapeHtml(title)}', '${item.displayDate || item.date}', '${escapeHtml(body)}')">${readMoreText}</button>
                `;

                container.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
        }

        function openModal(title, date, body) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDate').textContent = date;
            document.getElementById('modalBody').textContent = body;
            document.getElementById('articleModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('articleModal').classList.remove('active');
        }

        function closeModalOutside(event) {
            if (event.target === document.getElementById('articleModal')) {
                closeModal();
            }
        }

        function filterNews(tag) {
            currentFilter = tag;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderNews();
        }

        function setLanguage(lang, label) {
            currentLang = lang;
            document.getElementById('current-lang-btn').innerHTML = label;

            if (lang === 'ar') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }

            // Tłumaczenie elementów nawigacji i menu
            const elements = document.querySelectorAll('[data-translate]');
            elements.forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // Ponowne renderowanie artykułów w nowym języku
            renderNews();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderNews();
        });
    </script>

</body>
</html>
