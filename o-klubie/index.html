<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Klubie - Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060606;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animowane tło */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #040404, #0f0f0f, #1a1402);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Górny pasek nawigacyjny z efektem szkła */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* Menu hamburgerowe */
        .menu-dropdown {
            position: relative;
            display: inline-block;
        }

        .menu-toggle-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .menu-toggle-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .side-menu-dropdown {
            position: absolute;
            left: 0;
            top: calc(100% + 12px);
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 12px 0;
            min-width: 260px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown {
            left: auto;
            right: 0;
        }

        .menu-dropdown:hover .side-menu-dropdown,
        .side-menu-dropdown:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .side-menu-dropdown li {
            position: relative;
        }

        .side-menu-dropdown li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 22px;
            color: #dddddd;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        html[dir="rtl"] .side-menu-dropdown li a {
            border-left: none;
            border-right: 3px solid transparent;
        }

        .side-menu-dropdown li a:hover {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
            border-left-color: #ffd700;
            padding-left: 26px;
        }

        html[dir="rtl"] .side-menu-dropdown li a:hover {
            border-right-color: #ffd700;
            padding-left: 22px;
            padding-right: 26px;
        }

        .side-menu-dropdown li a::after {
            content: '›';
            font-size: 1.2rem;
            color: #666;
            transition: color 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown li a::after {
            content: '‹';
        }

        .side-menu-dropdown li a:hover::after {
            color: #ffd700;
        }

        /* Podmenu dla zakładki Klub */
        .submenu-club {
            position: absolute;
            left: 100%;
            top: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 10px 0;
            min-width: 200px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateX(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        html[dir="rtl"] .submenu-club {
            left: auto;
            right: 100%;
            transform: translateX(-10px);
        }

        .has-submenu:hover .submenu-club {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        /* Logo kierujące na główną */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-container img {
            height: 50px;
            width: auto;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        /* Przełącznik języków */
        .lang-dropdown {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .lang-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            list-style: none;
            padding: 8px 0;
            min-width: 150px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.25s;
        }

        .lang-dropdown:hover .lang-menu,
        .lang-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .lang-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: #cccccc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .lang-menu li a:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        /* Główna treść strony – O Klubie */
        main {
            margin-top: 130px;
            padding: 20px 5% 80px 5%;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 0 2px 15px rgba(255, 215, 0, 0.25);
        }

        /* Siatka sekcji informacyjnych */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Kafelki informacji */
        .about-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.7), rgba(10, 10, 10, 0.8));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .about-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .about-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 215, 0, 0.45);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .about-card:hover::before {
            opacity: 1;
        }

        .about-card-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .about-card-text {
            font-size: 1rem;
            color: #cccccc;
            line-height: 1.7;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header>
        <div class="header-left">
            <!-- Rozwijane menu boczne -->
            <div class="menu-dropdown">
                <button class="menu-toggle-btn">☰</button>
                <ul class="side-menu-dropdown">
                    <li><a href="../aktualnosci" data-translate="news">Aktualności</a></li>
                    <li><a href="../druzyna" data-translate="team">Pierwsza drużyna</a></li>
                    <li><a href="../akademia" data-translate="academy">Akademia</a></li>
                    <li><a href="../terminarz" data-translate="schedule">Terminarz</a></li>
                    
                    <li class="has-submenu">
                        <a href="#" data-translate="club">Klub ›</a>
                        <ul class="submenu-club">
                            <li><a href="../historia" data-translate="history">Historia</a></li>
                            <li><a href="../o-klubie" data-translate="about">O klubie</a></li>
                            <li><a href="../ludzie-legionu" data-translate="people">Ludzie Legionu</a></li>
                        </ul>
                    </li>
                </ul>
            </div>

            <!-- Logo kierujące na główną -->
            <a href="../index.html" class="logo-container">
                <img src="../8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Legion Białystok Logo">
            </a>
        </div>

        <!-- Przełącznik języków -->
        <div class="lang-dropdown">
            <button class="lang-btn" id="current-lang-btn">🇵🇱 Polski</button>
            <ul class="lang-menu">
                <li><a href="#" onclick="setLanguage('pl', '🇵🇱 Polski')">🇵🇱 Polski</a></li>
                <li><a href="#" onclick="setLanguage('en', '🇬🇧 English')">🇬🇧 English</a></li>
                <li><a href="#" onclick="setLanguage('es', '🇪🇸 Español')">🇪🇸 Español</a></li>
                <li><a href="#" onclick="setLanguage('ru', '🇷🇺 Русский')">🇷🇺 Русский</a></li>
                <li><a href="#" onclick="setLanguage('ar', '🇸🇦 العربية')">🇸🇦 العربية</a></li>
            </ul>
        </div>
    </header>

    <main>
        <h1 class="section-title" data-translate="section_title">O Klubie</h1>

        <!-- Siatka informacyjna z obsługą localStorage (pod panel administracyjny) -->
        <div class="about-grid" id="about-container">
            <!-- Renderowane dynamicznie przez skrypt -->
        </div>
    </main>

    <script>
        const translations = {
            pl: {
                news: "Aktualności", team: "Pierwsza drużyna", academy: "Akademia", schedule: "Terminarz", club: "Klub ›", history: "Historia", about: "O klubie", people: "Ludzie Legionu",
                section_title: "O Klubie",
                sections: {
                    "sec-1": { title: "Kim jesteśmy?", text: "Legion Białystok to klub sportowy z pasją, tworzony przez społeczność zjednoczoną wokół miłości do piłki nożnej i walki do ostatniej minuty." },
                    "sec-2": { title: "Nasze cele", text: "Dążymy do ciągłego rozwoju sportowego, budowania silnej akademii dla młodzieży oraz godnego reprezentowania Białegostoku na arenie sportowej." },
                    "sec-3": { title: "Wartości i Zasady", text: "Szacunek, determinacja, fair play oraz wzajemne wsparcie to fundamenty, na których opiera się każdy zawodnik i działacz naszego klubu." }
                }
            },
            en: {
                news: "News", team: "First Team", academy: "Academy", schedule: "Schedule", club: "Club ›", history: "History", about: "About Club", people: "Legion People",
                section_title: "About Club",
                sections: {
                    "sec-1": { title: "Who we are?", text: "Legion Białystok is a passionate sports club created by a community united around the love for football and fighting until the last minute." },
                    "sec-2": { title: "Our Goals", text: "We strive for continuous sports development, building a strong youth academy, and proudly representing Białystok in sports arenas." },
                    "sec-3": { title: "Values & Principles", text: "Respect, determination, fair play, and mutual support are the foundations upon which every player and official of our club stands." }
                }
            },
            es: {
                news: "Noticias", team: "Primer Equipo", academy: "Academia", schedule: "Calendario", club: "Club ›", history: "Historia", about: "Sobre el Club", people: "Gente del Legion",
                section_title: "Sobre el Club",
                sections: {
                    "sec-1": { title: "¿Quiénes somos?", text: "Legion Białystok es un club deportivo apasionado creado por una comunidad unida por el amor al fútbol y la lucha hasta el último minuto." },
                    "sec-2": { title: "Nuestros Objetivos", text: "Aspiramos al desarrollo deportivo continuo, construyendo una sólida academia juvenil y representando con orgullo a Białystok." },
                    "sec-3": { title: "Valores y Principios", text: "El respeto, la determinación, el juego limpio y el apoyo mutuo son los cimientos sobre los que se apoya cada miembro del club." }
                }
            },
            ru: {
                news: "Новости", team: "Первая команда", academy: "Академия", schedule: "Расписание", club: "Клуб ›", history: "История", about: "О клубе", people: "Люди Легиона",
                section_title: "О Клубе",
                sections: {
                    "sec-1": { title: "Кто мы?", text: "«Легион Белосток» — это спортивный клуб с характером, созданный сообществом, объединенным любовью к футболу и борьбой до последней минуты." },
                    "sec-2": { title: "Наши цели", text: "Мы стремимся к постоянному спортивному развитию, созданию сильной молодежной академии и достойному представлению Белостока." },
                    "sec-3": { title: "Ценности и принципы", text: "Уважение, решительность, честная игра и взаимопомощь — это фундамент, на котором держится каждый игрок и сотрудник клуба." }
                }
            },
            ar: {
                news: "الأخبار", team: "الفريق الأول", academy: "الأكاديمية", schedule: "الجدول", club: "النادي ›", history: "التاريخ", about: "عن النادي", people: "أعضاء النادي",
                section_title: "عن النادي",
                sections: {
                    "sec-1": { title: "من نحن؟", text: "نادي ليجيون بياويستوك هو نادي رياضي شغوف يضم مجتمعاً متحداً حول حب كرة القدم والقتال حتى الدقيقة الأخيرة." },
                    "sec-2": { title: "أهدافنا", text: "نسعى جاهدين للتطور الرياضي المستمر، وبناء أكاديمية قوية للشباب، وتمثيل بياويستوك بكل فخر." },
                    "sec-3": { title: "القيم والمبادئ", text: "الاحترام، الإزمام، اللعب النظيف والدعم المتبادل هي الأسس التي يقوم عليها كل لاعب ومسؤول في نادينا." }
                }
            }
        };

        let currentLang = 'pl';

        const defaultSections = [
            { id: "sec-1" },
            { id: "sec-2" },
            { id: "sec-3" }
        ];

        function renderAbout() {
            const container = document.getElementById('about-container');
            container.innerHTML = '';

            let savedSections = JSON.parse(localStorage.getItem('legion_about')) || defaultSections;
            const langData = translations[currentLang] || translations['pl'];
            const tSections = langData.sections || {};

            savedSections.forEach(item => {
                const secData = tSections[item.id] || {
                    title: item.title || "",
                    text: item.text || ""
                };

                const card = document.createElement('div');
                card.className = 'about-card';
                card.id = item.id;
                card.setAttribute('data-about-id', item.id);

                card.innerHTML = `
                    <div class="about-card-title">${secData.title}</div>
                    <div class="about-card-text">${secData.text}</div>
                `;

                container.appendChild(card);
            });
        }

        function setLanguage(lang, label) {
            currentLang = lang;
            document.getElementById('current-lang-btn').innerHTML = label;

            if (lang === 'ar') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }

            const elements = document.querySelectorAll('[data-translate]');
            elements.forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            renderAbout();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderAbout();
        });
    </script>

</body>
</html>
