<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierwsza Drużyna - Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060606;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animowane tło */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #040404, #0f0f0f, #1a1402);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Górny pasek nawigacyjny z efektem szkła */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* Menu hamburgerowe */
        .menu-dropdown {
            position: relative;
            display: inline-block;
        }

        .menu-toggle-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .menu-toggle-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .side-menu-dropdown {
            position: absolute;
            left: 0;
            top: calc(100% + 12px);
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 12px 0;
            min-width: 260px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown {
            left: auto;
            right: 0;
        }

        .menu-dropdown:hover .side-menu-dropdown,
        .side-menu-dropdown:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .side-menu-dropdown li {
            position: relative;
        }

        .side-menu-dropdown li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 22px;
            color: #dddddd;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        html[dir="rtl"] .side-menu-dropdown li a {
            border-left: none;
            border-right: 3px solid transparent;
        }

        .side-menu-dropdown li a:hover {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
            border-left-color: #ffd700;
            padding-left: 26px;
        }

        html[dir="rtl"] .side-menu-dropdown li a:hover {
            border-right-color: #ffd700;
            padding-left: 22px;
            padding-right: 26px;
        }

        .side-menu-dropdown li a::after {
            content: '›';
            font-size: 1.2rem;
            color: #666;
            transition: color 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown li a::after {
            content: '‹';
        }

        .side-menu-dropdown li a:hover::after {
            color: #ffd700;
        }

        /* Podmenu dla zakładki Klub */
        .submenu-club {
            position: absolute;
            left: 100%;
            top: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 10px 0;
            min-width: 200px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateX(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        html[dir="rtl"] .submenu-club {
            left: auto;
            right: 100%;
            transform: translateX(-10px);
        }

        .has-submenu:hover .submenu-club {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        /* Logo kierujące na główną */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-container img {
            height: 50px;
            width: auto;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        /* Przełącznik języków */
        .lang-dropdown {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .lang-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            list-style: none;
            padding: 8px 0;
            min-width: 150px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.25s;
        }

        .lang-dropdown:hover .lang-menu,
        .lang-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .lang-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: #cccccc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .lang-menu li a:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        /* Główna treść strony – Pierwsza Drużyna */
        main {
            margin-top: 130px;
            padding: 20px 4% 80px 4%;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-align: center;
            text-shadow: 0 2px 15px rgba(255, 215, 0, 0.25);
        }

        /* Siatka zawodników pierwszej drużyny */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        @media (max-width: 1200px) {
            .players-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .players-grid {
                grid-template-columns: 1fr;
            }
        }

        .player-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.7), rgba(10, 10, 10, 0.8));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .player-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.45);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .player-card:hover::before {
            opacity: 1;
        }

        .player-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .player-position {
            font-size: 0.95rem;
            color: #ffd700;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Okno modalne */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.95), rgba(12, 12, 12, 0.98));
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 35px;
            max-width: 500px;
            width: 100%;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #ffd700;
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.2);
        }

        .modal-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        .modal-subtitle {
            font-size: 1rem;
            color: #ffd700;
            font-weight: 600;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            text-align: left;
            background: rgba(255, 215, 0, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .modal-info-item {
            font-size: 0.9rem;
            color: #cccccc;
        }

        .modal-info-item span {
            color: #ffd700;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header>
        <div class="header-left">
            <div class="menu-dropdown">
                <button class="menu-toggle-btn">☰</button>
                <ul class="side-menu-dropdown">
                    <li><a href="../aktualnosci" data-translate="news">Aktualności</a></li>
                    <li><a href="../druzyna" data-translate="team">Pierwsza drużyna</a></li>
                    <li><a href="../akademia" data-translate="academy">Akademia</a></li>
                    <li><a href="../tabela" data-translate="table">Tabela</a></li>
                    
                    <li class="has-submenu">
                        <a href="#" data-translate="club">Klub ›</a>
                        <ul class="submenu-club">
                            <li><a href="../historia" data-translate="history">Historia</a></li>
                            <li><a href="../o-klubie" data-translate="about">O klubie</a></li>
                            <li><a href="../ludzie-legionu" data-translate="people">Ludzie Legionu</a></li>
                        </ul>
                    </li>
                </ul>
            </div>

            <a href="../index.html" class="logo-container">
                <img src="../8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Legion Białystok Logo">
            </a>
        </div>

        <div class="lang-dropdown">
            <button class="lang-btn" id="current-lang-btn">🇵🇱 Polski</button>
            <ul class="lang-menu">
                <li><a href="#" onclick="setLanguage('pl', '🇵🇱 Polski')">🇵🇱 Polski</a></li>
                <li><a href="#" onclick="setLanguage('en', '🇬🇧 English')">🇬🇧 English</a></li>
                <li><a href="#" onclick="setLanguage('es', '🇪🇸 Español')">🇪🇸 Español</a></li>
                <li><a href="#" onclick="setLanguage('ru', '🇷🇺 Русский')">🇷🇺 Русский</a></li>
                <li><a href="#" onclick="setLanguage('ar', '🇸🇦 العربية')">🇸🇦 العربية</a></li>
            </ul>
        </div>
    </header>

    <main>
        <h1 class="section-title" data-translate="section_title">Pierwsza Drużyna</h1>

        <div class="players-grid" id="players-container">
            <!-- Renderowane dynamicznie -->
        </div>
    </main>

    <!-- Modal -->
    <div class="modal" id="playerModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModalDirect()">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const translations = {
            pl: {
                news: "Aktualności", team: "Pierwsza drużyna", academy: "Akademia", table: "Tabela", club: "Klub ›", history: "Historia", about: "O klubie", people: "Ludzie Legionu",
                section_title: "Pierwsza Drużyna"
            },
            en: {
                news: "News", team: "First Team", academy: "Academy", table: "Standings", club: "Club ›", history: "History", about: "About Club", people: "Legion People",
                section_title: "First Team"
            },
            es: {
                news: "Noticias", team: "Primer Equipo", academy: "Academia", table: "Clasificación", club: "Club ›", history: "Historia", about: "Sobre el Club", people: "Gente del Legion",
                section_title: "Primer Equipo"
            },
            ru: {
                news: "Новости", team: "Первая команда", academy: "Академия", table: "Таблица", club: "Клуб ›", history: "История", about: "О клубе", people: "Люди Легиона",
                section_title: "Первая команда"
            },
            ar: {
                news: "الأخبار", team: "الفريق الأول", academy: "الأكاديمية", table: "الترتيب", club: "النادي ›", history: "التاريخ", about: "عن النادي", people: "أعضاء النادي",
                section_title: "الفريق الأول"
            }
        };

        let currentLang = 'pl';

        const defaultPlayers = [
            { id: "t-1", name: "Jan Kowalski", position: "Napastnik", age: "20 lat", matches: "10", goals: "6", number: "9" },
            { id: "t-2", name: "Piotr Nowak", position: "Pomocnik", age: "22 lat", matches: "12", goals: "3", number: "10" }
        ];

        function renderPlayers() {
            const container = document.getElementById('players-container');
            container.innerHTML = '';

            let storedData = localStorage.getItem('legion_first_team');
            let data = storedData ? JSON.parse(storedData) : null;

            if (!data || data.length === 0) {
                localStorage.setItem('legion_first_team', JSON.stringify(defaultPlayers));
                data = defaultPlayers;
            }

            data.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.onclick = () => openModal(player);

                card.innerHTML = `
                    <h3 class="player-name">${player.name}</h3>
                    <p class="player-position">${player.position}</p>
                `;

                container.appendChild(card);
            });
        }

        function openModal(player) {
            const modal = document.getElementById('playerModal');
            const modalBody = document.getElementById('modal-body');

            modalBody.innerHTML = `
                <h2 class="modal-title">${player.name}</h2>
                <p class="modal-subtitle">${player.position} #${player.number || '0'}</p>
                <div class="modal-info-grid">
                    <div class="modal-info-item">Wiek: <span>${player.age || 'B/D'}</span></div>
                    <div class="modal-info-item">Numer: <span>#${player.number || 'B/D'}</span></div>
                    <div class="modal-info-item">Mecze: <span>${player.matches || '0'}</span></div>
                    <div class="modal-info-item">Gole: <span>${player.goals || '0'}</span></div>
                </div>
            `;

            modal.style.display = 'flex';
        }

        function closeModal(event) {
            document.getElementById('playerModal').style.display = 'none';
        }

        function closeModalDirect() {
            document.getElementById('playerModal').style.display = 'none';
        }

        function setLanguage(lang, label) {
            currentLang = lang;
            document.getElementById('current-lang-btn').innerHTML = label;

            if (lang === 'ar') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }

            const elements = document.querySelectorAll('[data-translate]');
            elements.forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderPlayers();
        });
    </script>

</body>
</html>
