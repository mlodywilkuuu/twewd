<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animowane tło */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #050505, #111111, #1a1504);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Górny pasek nawigacyjny z efektem szkła */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(12, 12, 12, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* Styl przycisku menu (hamburger) i rozwijanej listy */
        .menu-dropdown {
            position: relative;
            display: inline-block;
        }

        .menu-toggle-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .menu-toggle-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .side-menu-dropdown {
            position: absolute;
            left: 0;
            top: calc(100% + 12px);
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 12px 0;
            min-width: 260px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown {
            left: auto;
            right: 0;
        }

        .menu-dropdown:hover .side-menu-dropdown,
        .side-menu-dropdown:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .side-menu-dropdown li {
            position: relative;
        }

        .side-menu-dropdown li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 22px;
            color: #dddddd;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        html[dir="rtl"] .side-menu-dropdown li a {
            border-left: none;
            border-right: 3px solid transparent;
        }

        .side-menu-dropdown li a:hover {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
            border-left-color: #ffd700;
            padding-left: 26px;
        }

        html[dir="rtl"] .side-menu-dropdown li a:hover {
            border-right-color: #ffd700;
            padding-left: 22px;
            padding-right: 26px;
        }

        .side-menu-dropdown li a::after {
            content: '›';
            font-size: 1.2rem;
            color: #666;
            transition: color 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown li a::after {
            content: '‹';
        }

        .side-menu-dropdown li a:hover::after {
            color: #ffd700;
        }

        /* Podmenu dla zakładki Klub */
        .submenu-club {
            position: absolute;
            left: 100%;
            top: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 10px 0;
            min-width: 200px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateX(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        html[dir="rtl"] .submenu-club {
            left: auto;
            right: 100%;
            transform: translateX(-10px);
        }

        .has-submenu:hover .submenu-club {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        /* Klikalne logo kierujące na stronę główną */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-container img {
            height: 50px;
            width: auto;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        /* Rozwijane menu językowe z flagami po prawej stronie */
        .lang-dropdown {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .lang-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            list-style: none;
            padding: 8px 0;
            min-width: 150px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.25s;
        }

        .lang-dropdown:hover .lang-menu,
        .lang-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .lang-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: #cccccc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .lang-menu li a:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        /* Główna treść strony głównej */
        main {
            margin-top: 130px;
            padding: 20px 5% 80px 5%;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 0 2px 15px rgba(255, 215, 0, 0.25);
        }

        /* Siatka kafelków */
        .squad-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        .player-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.7), rgba(10, 10, 10, 0.8));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .player-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 215, 0, 0.45);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .player-card:hover::before {
            opacity: 1;
        }

        .player-number {
            font-size: 3rem;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 12px;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .player-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .player-position {
            font-size: 0.85rem;
            color: #999999;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Modal / Okno wyskakujące z informacjami o zawodniku */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .modal-player-number {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .modal-player-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 25px;
        }

        .modal-info-list {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .modal-info-item {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            color: #cccccc;
        }

        .modal-info-label {
            color: #888888;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .modal-info-value {
            color: #ffffff;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header>
        <div class="header-left">
            <!-- Rozwijane menu boczne -->
            <div class="menu-dropdown">
                <button class="menu-toggle-btn">☰</button>
                <ul class="side-menu-dropdown">
                    <li><a href="aktualnosci" data-translate="news">Aktualności</a></li>
                    <li><a href="druzyna" data-translate="team">Pierwsza drużyna</a></li>
                    <li><a href="akademia" data-translate="academy">Akademia</a></li>
                    <li><a href="terminarz" data-translate="schedule">Terminarz</a></li>
                    
                    <li class="has-submenu">
                        <a href="#" data-translate="club">Klub ›</a>
                        <ul class="submenu-club">
                            <li><a href="historia" data-translate="history">Historia</a></li>
                            <li><a href="o-klubie" data-translate="about">O klubie</a></li>
                            <li><a href="ludzie-legionu" data-translate="people">Ludzie Legionu</a></li>
                        </ul>
                    </li>
                </ul>
            </div>

            <!-- Logo kierujące na stronę główną -->
            <a href="index.html" class="logo-container">
                <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Legion Białystok Logo">
            </a>
        </div>

        <!-- Przełącznik języków -->
        <div class="lang-dropdown">
            <button class="lang-btn" id="current-lang-btn">🇵🇱 Polski</button>
            <ul class="lang-menu">
                <li><a href="#" onclick="setLanguage('pl', '🇵🇱 Polski')">🇵🇱 Polski</a></li>
                <li><a href="#" onclick="setLanguage('en', '🇬🇧 English')">🇬🇧 English</a></li>
                <li><a href="#" onclick="setLanguage('es', '🇪🇸 Español')">🇪🇸 Español</a></li>
                <li><a href="#" onclick="setLanguage('ru', '🇷🇺 Русский')">🇷🇺 Русский</a></li>
                <li><a href="#" onclick="setLanguage('ar', '🇸🇦 العربية')">🇸🇦 العربية</a></li>
            </ul>
        </div>
    </header>

    <main>
        <h1 class="section-title" data-translate="section_title">Pierwsza Drużyna</h1>

        <!-- Siatka kafelków zawodników z obsługą localStorage -->
        <div class="squad-grid" id="squad-container">
            <!-- Dynamicznie renderowane kafelki -->
        </div>
    </main>

    <!-- Okno wyskakujące (Modal) z informacjami o zawodniku -->
    <div class="modal-overlay" id="playerModal" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-player-number" id="modalNumber"></div>
            <div class="modal-player-name" id="modalName"></div>
            
            <div class="modal-info-list">
                <div class="modal-info-item">
                    <span class="modal-info-label" data-translate="label_position">Pozycja</span>
                    <span class="modal-info-value" id="modalPosition"></span>
                </div>
                <div class="modal-info-item">
                    <span class="modal-info-label" data-translate="label_nationality">Narodowość</span>
                    <span class="modal-info-value" id="modalNationality"></span>
                </div>
                <div class="modal-info-item">
                    <span class="modal-info-label" data-translate="label_birthdate">Data urodzenia</span>
                    <span class="modal-info-value" id="modalBirthdate"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            pl: {
                news: "Aktualności", team: "Pierwsza drużyna", academy: "Akademia", schedule: "Terminarz", club: "Klub ›", history: "Historia", about: "O klubie", people: "Ludzie Legionu",
                section_title: "Pierwsza Drużyna",
                label_position: "Pozycja",
                label_nationality: "Narodowość",
                label_birthdate: "Data urodzenia",
                positions: { gk: "Bramkarz", def: "Obrońca", mid: "Pomocnik", fwd: "Napastnik" }
            },
            en: {
                news: "News", team: "First Team", academy: "Academy", schedule: "Schedule", club: "Club ›", history: "History", about: "About Club", people: "Legion People",
                section_title: "First Team",
                label_position: "Position",
                label_nationality: "Nationality",
                label_birthdate: "Birth Date",
                positions: { gk: "Goalkeeper", def: "Defender", mid: "Midfielder", fwd: "Forward" }
            },
            es: {
                news: "Noticias", team: "Primer Equipo", academy: "Academia", schedule: "Calendario", club: "Club ›", history: "Historia", about: "Sobre el Club", people: "Gente del Legion",
                section_title: "Primer Equipo",
                label_position: "Posición",
                label_nationality: "Nacionalidad",
                label_birthdate: "Fecha de Nacimiento",
                positions: { gk: "Portero", def: "Defensa", mid: "Centrocampista", fwd: "Delantero" }
            },
            ru: {
                news: "Новости", team: "Первая команда", academy: "Академия", schedule: "Расписание", club: "Клуб ›", history: "История", about: "О клубе", people: "Люди Легиона",
                section_title: "Первая Команда",
                label_position: "Позиция",
                label_nationality: "Национальность",
                label_birthdate: "Дата рождения",
                positions: { gk: "Вратарь", def: "Защитник", mid: "Полузащитник", fwd: "Нападающий" }
            },
            ar: {
                news: "الأخبار", team: "الفريق الأول", academy: "الأكاديمية", schedule: "الجدول", club: "النادي ›", history: "التاريخ", about: "عن النادي", people: "أعضاء النادي",
                section_title: "الفريق الأول",
                label_position: "المركز",
                label_nationality: "الجنسية",
                label_birthdate: "تاريخ الميلاد",
                positions: { gk: "حارس مرمى", def: "مدافع", mid: "لاعب خط وسط", fwd: "مهاجم" }
            }
        };

        let currentLang = 'pl';

        const defaultPlayers = [
            { id: "player-1", number: "1", name: "Jan Kowalski", positionKey: "gk", nationality: "Polska", birthdate: "12.05.1998" },
            { id: "player-2", number: "4", name: "Piotr Nowak", positionKey: "def", nationality: "Polska", birthdate: "23.09.2001" },
            { id: "player-3", number: "8", name: "Michał Wiśniewski", positionKey: "mid", nationality: "Polska", birthdate: "04.01.1999" },
            { id: "player-4", number: "10", name: "Kamil Wójcik", positionKey: "fwd", nationality: "Polska", birthdate: "18.11.2000" }
        ];

        function renderSquad() {
            const container = document.getElementById('squad-container');
            container.innerHTML = '';

            let savedPlayers = JSON.parse(localStorage.getItem('legion_players')) || defaultPlayers;
            const langData = translations[currentLang] || translations['pl'];
            const tPositions = langData.positions || {};

            savedPlayers.forEach(player => {
                const positionName = tPositions[player.positionKey] || player.positionKey;

                const card = document.createElement('div');
                card.className = 'player-card';
                card.id = player.id;
                card.setAttribute('data-player-id', player.id);

                card.onclick = () => openModal(player.number, player.name, positionName, player.nationality, player.birthdate);

                card.innerHTML = `
                    <div class="player-number">${player.number}</div>
                    <div class="player-name">${player.name}</div>
                    <div class="player-position">${positionName}</div>
                `;

                container.appendChild(card);
            });
        }

        function openModal(number, name, position, nationality, birthdate) {
            document.getElementById('modalNumber').textContent = number;
            document.getElementById('modalName').textContent = name;
            document.getElementById('modalPosition').textContent = position;
            document.getElementById('modalNationality').textContent = nationality;
            document.getElementById('modalBirthdate').textContent = birthdate;
            document.getElementById('playerModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('playerModal').classList.remove('active');
        }

        function closeModalOutside(event) {
            if (event.target === document.getElementById('playerModal')) {
                closeModal();
            }
        }

        function setLanguage(lang, label) {
            currentLang = lang;
            document.getElementById('current-lang-btn').innerHTML = label;

            if (lang === 'ar') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }

            const elements = document.querySelectorAll('[data-translate]');
            elements.forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            renderSquad();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderSquad();
        });
    </script>

</body>
</html>
