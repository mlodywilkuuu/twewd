<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akademia - Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060606;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animowane tło */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #040404, #0f0f0f, #1a1402);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Górny pasek nawigacyjny z efektem szkła */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* Menu hamburgerowe */
        .menu-dropdown {
            position: relative;
            display: inline-block;
        }

        .menu-toggle-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .menu-toggle-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .side-menu-dropdown {
            position: absolute;
            left: 0;
            top: calc(100% + 12px);
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 12px 0;
            min-width: 260px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown {
            left: auto;
            right: 0;
        }

        .menu-dropdown:hover .side-menu-dropdown,
        .side-menu-dropdown:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .side-menu-dropdown li {
            position: relative;
        }

        .side-menu-dropdown li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 22px;
            color: #dddddd;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        html[dir="rtl"] .side-menu-dropdown li a {
            border-left: none;
            border-right: 3px solid transparent;
        }

        .side-menu-dropdown li a:hover {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
            border-left-color: #ffd700;
            padding-left: 26px;
        }

        html[dir="rtl"] .side-menu-dropdown li a:hover {
            border-right-color: #ffd700;
            padding-left: 22px;
            padding-right: 26px;
        }

        .side-menu-dropdown li a::after {
            content: '›';
            font-size: 1.2rem;
            color: #666;
            transition: color 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown li a::after {
            content: '‹';
        }

        .side-menu-dropdown li a:hover::after {
            color: #ffd700;
        }

        /* Podmenu dla zakładki Klub */
        .submenu-club {
            position: absolute;
            left: 100%;
            top: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 10px 0;
            min-width: 200px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateX(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        html[dir="rtl"] .submenu-club {
            left: auto;
            right: 100%;
            transform: translateX(-10px);
        }

        .has-submenu:hover .submenu-club {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        /* Logo kierujące na główną */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-container img {
            height: 50px;
            width: auto;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        /* Przełącznik języków */
        .lang-dropdown {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .lang-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            list-style: none;
            padding: 8px 0;
            min-width: 150px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.25s;
        }

        .lang-dropdown:hover .lang-menu,
        .lang-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .lang-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: #cccccc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .lang-menu li a:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        /* Główna treść strony – Akademia */
        main {
            margin-top: 130px;
            padding: 20px 5% 80px 5%;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 0 2px 15px rgba(255, 215, 0, 0.25);
        }

        /* Siatka kafelków akademii */
        .academy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Kafelki grup wiekowych / akademii z efektem szkła */
        .academy-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.7), rgba(10, 10, 10, 0.8));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .academy-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .academy-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 215, 0, 0.45);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .academy-card:hover::before {
            opacity: 1;
        }

        .academy-group-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .academy-coach {
            font-size: 0.85rem;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .academy-desc {
            font-size: 0.95rem;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .academy-btn {
            align-self: flex-start;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .academy-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            border-color: #ffd700;
        }

        /* Modal / Okno wyskakujące dla szczegółów grupy */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .modal-subtitle {
            font-size: 0.85rem;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .modal-body {
            font-size: 1.05rem;
            color: #cccccc;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header>
        <div class="header-left">
            <!-- Rozwijane menu boczne -->
            <div class="menu-dropdown">
                <button class="menu-toggle-btn">☰</button>
                <ul class="side-menu-dropdown">
                    <li><a href="../aktualnosci" data-translate="news">Aktualności</a></li>
                    <li><a href="../druzyna" data-translate="team">Pierwsza drużyna</a></li>
                    <li><a href="../akademia" data-translate="academy">Akademia</a></li>
                    <li><a href="../terminarz" data-translate="schedule">Terminarz</a></li>
                    
                    <li class="has-submenu">
                        <a href="#" data-translate="club">Klub ›</a>
                        <ul class="submenu-club">
                            <li><a href="../historia" data-translate="history">Historia</a></li>
                            <li><a href="../o-klubie" data-translate="about">O klubie</a></li>
                            <li><a href="../ludzie-legionu" data-translate="people">Ludzie Legionu</a></li>
                        </ul>
                    </li>
                </ul>
            </div>

            <!-- Logo kierujące na główną -->
            <a href="../index.html" class="logo-container">
                <img src="../8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Legion Białystok Logo">
            </a>
        </div>

        <!-- Przełącznik języków -->
        <div class="lang-dropdown">
            <button class="lang-btn" id="current-lang-btn">🇵🇱 Polski</button>
            <ul class="lang-menu">
                <li><a href="#" onclick="setLanguage('pl', '🇵🇱 Polski')">🇵🇱 Polski</a></li>
                <li><a href="#" onclick="setLanguage('en', '🇬🇧 English')">🇬🇧 English</a></li>
                <li><a href="#" onclick="setLanguage('es', '🇪🇸 Español')">🇪🇸 Español</a></li>
                <li><a href="#" onclick="setLanguage('ru', '🇷🇺 Русский')">🇷🇺 Русский</a></li>
                <li><a href="#" onclick="setLanguage('ar', '🇸🇦 العربية')">🇸🇦 العربية</a></li>
            </ul>
        </div>
    </header>

    <main>
        <h1 class="section-title" data-translate="section_title">Akademia Legionu</h1>

        <!-- Siatka kafelków akademii z obsługą localStorage (pod przyszły panel) -->
        <div class="academy-grid" id="academy-container">
            <!-- Renderowane dynamicznie przez skrypt -->
        </div>
    </main>

    <!-- Okno wyskakujące (Modal) dla szczegółów grupy -->
    <div class="modal-overlay" id="academyModal" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-subtitle" id="modalCoach"></div>
            <h2 class="modal-title" id="modalTitle"></h2>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        const translations = {
            pl: {
                news: "Aktualności", team: "Pierwsza drużyna", academy: "Akademia", schedule: "Terminarz", club: "Klub ›", history: "Historia", about: "O klubie", people: "Ludzie Legionu",
                section_title: "Akademia Legionu",
                details_btn: "Szczegóły grupy ›",
                groups: {
                    "group-1": { title: "Juniorzy Młodsi (U-17)", coach: "Trener: Marek Kowalczyk", desc: "Intensywne szkolenie piłkarskie przygotowujące zawodników do gry w seniorskiej piłce nożnej.", body: "Grupa U-17 skupia się na zaawansowanej taktyce meczowej, motoryce oraz przygotowaniu mentalnym do rywalizacji na poziomie lig wojewódzkich i ogólnokrajowych." },
                    "group-2": { title: "Trampkarze (U-15)", coach: "Trener: Tomasz Zieliński", desc: "Rozwój techniki indywidualnej, świadomości boiskowej oraz zasad fair play.", body: "W grupie trampkarzy kładziemy nacisk na opanowanie fundamentów technicznych, naukę gry kombinacyjnej oraz budowanie ducha zespołowego." }
                }
            },
            en: {
                news: "News", team: "First Team", academy: "Academy", schedule: "Schedule", club: "Club ›", history: "History", about: "About Club", people: "Legion People",
                section_title: "Legion Academy",
                details_btn: "Group details ›",
                groups: {
                    "group-1": { title: "Junior Youth (U-17)", coach: "Coach: Marek Kowalczyk", desc: "Intensive football training preparing players for senior football competition.", body: "The U-17 group focuses on advanced match tactics, motor skills, and mental preparation for regional and national leagues." },
                    "group-2": { title: "Youth Squad (U-15)", coach: "Coach: Tomasz Zieliński", desc: "Development of individual technique, pitch awareness, and fair play principles.", body: "In the U-15 group, we emphasize mastering technical fundamentals, combinatorial play, and building team spirit." }
                }
            },
            es: {
                news: "Noticias", team: "Primer Equipo", academy: "Academia", schedule: "Calendario", club: "Club ›", history: "Historia", about: "Sobre el Club", people: "Gente del Legion",
                section_title: "Academia Legion",
                details_btn: "Detalles del grupo ›",
                groups: {
                    "group-1": { title: "Juvenil (U-17)", coach: "Entrenador: Marek Kowalczyk", desc: "Entrenamiento intensivo de fútbol preparando a los jugadores para el fútbol sénior.", body: "El grupo U-17 se centra en tácticas avanzadas, habilidades motoras y preparación mental." },
                    "group-2": { title: "Cadete (U-15)", coach: "Entrenador: Tomasz Zieliński", desc: "Desarrollo de la técnica individual, conciencia táctica y juego limpio.", body: "En el grupo U-15 enfatizamos el dominio de los fundamentos técnicos y el juego combinativo." }
                }
            },
            ru: {
                news: "Новости", team: "Первая команда", academy: "Академия", schedule: "Расписание", club: "Клуб ›", history: "История", about: "О клубе", people: "Люди Легиона",
                section_title: "Академия Легиона",
                details_btn: "Детали группы ›",
                groups: {
                    "group-1": { title: "Юниоры (U-17)", coach: "Тренер: Марек Ковальчик", desc: "Интенсивная подготовка игроков к выступлениям во взрослом футболе.", body: "Группа U-17 фокусируется на продвинутой тактике, физической подготовке и психологии." },
                    "group-2": { title: "Младшие юноши (U-15)", coach: "Тренер: Томаш Зелинский", desc: "Развитие индивидуальной техники, видения поля и принципов честной игры.", body: "В группе U-15 мы делаем акцент на освоении технических основ и командном взаимодействии." }
                }
            },
            ar: {
                news: "الأخبار", team: "الفريق الأول", academy: "الأكاديمية", schedule: "الجدول", club: "النادي ›", history: "التاريخ", about: "عن النادي", people: "أعضاء النادي",
                section_title: "أكاديمية ليجيون",
                details_btn: "تفاصيل المجموعة ›",
                groups: {
                    "group-1": { title: "الناشئون (U-17)", coach: "المدرب: ماريك كوفالчик", desc: "تدريب مكثف لكرة القدم لإعداد اللاعبين للمنافسة في فئة الفريق الأول.", body: "تركز مجموعة U-17 على التكتيكات المتقدمة والمهارات الحركية والاستعداد الذهني للبطولات." },
                    "group-2": { title: "الشباب (U-15)", coach: "المدرب: توماش زيلينسكي", desc: "تطوير المهارات الفردية، والوعي بالملعب، ومبادئ اللعب النظيف.", body: "في مجموعة U-15، نؤكد على إتقان الأساسيات الفنية واللعب الجماعي." }
                }
            }
        };

        let currentLang = 'pl';

        const defaultAcademyGroups = [
            { id: "group-1" },
            { id: "group-2" }
        ];

        function renderAcademy() {
            const container = document.getElementById('academy-container');
            container.innerHTML = '';

            let savedGroups = JSON.parse(localStorage.getItem('legion_academy')) || defaultAcademyGroups;
            const langData = translations[currentLang] || translations['pl'];
            const tGroups = langData.groups || {};
            const detailsBtnText = langData.details_btn || "Szczegóły grupy ›";

            savedGroups.forEach(item => {
                const groupData = tGroups[item.id] || {
                    title: item.title || "Grupa treningowa",
                    coach: item.coach || "",
                    desc: item.desc || "",
                    body: item.body || ""
                };

                const card = document.createElement('div');
                card.className = 'academy-card';
                card.id = item.id;
                card.setAttribute('data-academy-id', item.id);

                card.innerHTML = `
                    <div class="academy-group-title">${groupData.title}</div>
                    <div class="academy-coach">${groupData.coach}</div>
                    <div class="academy-desc">${groupData.desc}</div>
                    <button class="academy-btn" onclick="openModal('${escapeHtml(groupData.title)}', '${escapeHtml(groupData.coach)}', '${escapeHtml(groupData.body)}')">${detailsBtnText}</button>
                `;

                container.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
        }

        function openModal(title, coach, body) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalCoach').textContent = coach;
            document.getElementById('modalBody').textContent = body;
            document.getElementById('academyModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('academyModal').classList.remove('active');
        }

        function closeModalOutside(event) {
            if (event.target === document.getElementById('academyModal')) {
                closeModal();
            }
        }

        function setLanguage(lang, label) {
            currentLang = lang;
            document.getElementById('current-lang-btn').innerHTML = label;

            if (lang === 'ar') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }

            const elements = document.querySelectorAll('[data-translate]');
            elements.forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            renderAcademy();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderAcademy();
        });
    </script>

</body>
</html>
