<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d; /* Eleganckie czarne tło strony */
            color: #ffffff;
        }

        /* Pasek menu */
        header {
            width: 100%;
            background-color: #000000;
            border-bottom: 1px solid #d4af37; /* Delikatna złota linia na dole menu */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            height: 80px;
        }

        /* Linki w menu */
        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #d4af37; /* Złoty kolor tekstów menu */
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* Kontener na logo po prawej stronie na maxa */
        .logo-container {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .logo-container img {
            height: 55px; /* Dopasowanie wysokości logo do paska */
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header>
        <!-- Sekcja z linkami menu po lewej/środku -->
        <nav>
            <a href="#">Strona Główna</a>
            <a href="#">Drużyna</a>
            <a href="#">Terminarz</a>
            <a href="#">Wyniki</a>
            <a href="#">Bilety</a>
            <a href="#">Kontakt</a>
        </nav>

        <!-- Logo Legion Białystok na samym końcu po prawej stronie -->
        <div class="logo-container">
            <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Legion Białystok Logo">
        </div>
    </header>

</body>
</html>
