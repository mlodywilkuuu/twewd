<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Białystok</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', Arial, sans-serif;
}

/* ===== TŁO ===== */
body{
  height:100vh;
  overflow:hidden;
  color:white;
}

.bg{
  position:fixed;
  width:100%;
  height:100%;
  background: linear-gradient(-45deg, #0b0f14, #162033, #0b0f14, #1a2a44);
  background-size:400% 400%;
  animation: gradient 12s ease infinite;
  z-index:-1;
}

@keyframes gradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ===== MAINTENANCE ===== */
.maintenance{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  max-width:420px;
}

.logo-maintenance{
  width:110px;
  margin-bottom:20px;
}

.line{
  width:60px;
  height:2px;
  background:#00aaff;
  margin:15px auto;
}

.status{
  font-size:14px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#00aaff;
}

.desc{
  margin-top:10px;
  color:#aaa;
  font-size:14px;
}

/* ===== UKRYTY PRZYCISK ===== */
.hidden-btn{
  position:fixed;
  top:0;
  right:0;
  width:70px;
  height:70px;
  opacity:0;
  cursor:pointer;
}

/* ===== STRONA ===== */
.main-site{
  display:none;
  padding-top:80px;
}

/* ===== NAV ===== */
nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:12px 30px;

  background:rgba(10,15,20,0.55);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.08);

  transition:0.3s;
  z-index:1000;
}

nav.hide{
  transform:translateY(-100%);
}

/* LOGO */
.nav-left img{
  width:38px;
}

/* MENU */
.nav-center{
  display:flex;
  gap:25px;
}

.nav-center a{
  color:#cfcfcf;
  text-decoration:none;
  font-size:14px;
  padding:6px 10px;
  border-radius:8px;
  transition:0.2s;
}

.nav-center a:hover{
  background:rgba(255,255,255,0.08);
  color:white;
}

/* ===== HERO ===== */
.hero{
  padding:120px 40px;
}

.hero h1{
  font-size:42px;
}

.hero p{
  color:#aaa;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- UKRYTY START -->
<div class="hidden-btn" onclick="showSite()"></div>

<!-- MAINTENANCE -->
<div class="maintenance" id="maintenance">

  <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png"
       class="logo-maintenance">

  <div class="line"></div>

  <div class="status">Prace techniczne</div>

  <div class="desc">
    Strona chwilowo niedostępna<br>
    Trwają prace modernizacyjne
  </div>

</div>

<!-- STRONA -->
<div class="main-site" id="mainSite">

  <nav id="navbar">

    <div class="nav-left">
      <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png">
    </div>

    <div class="nav-center">
      <a href="#">Home</a>
      <a href="#">News</a>
      <a href="#">Matches</a>
      <a href="#">Team</a>
    </div>

  </nav>

  <div class="hero">
    <h1>Legion Białystok</h1>
    <p>Nowa era klubu</p>
  </div>

</div>

<script>
function showSite(){
  document.getElementById("maintenance").style.display = "none";
  document.getElementById("mainSite").style.display = "block";
  document.body.style.overflow = "auto";
}

/* scroll hide navbar */
let lastScroll = 0;
const nav = document.getElementById("navbar");

window.addEventListener("scroll", () => {
  const current = window.pageYOffset;

  if(current > lastScroll){
    nav.classList.add("hide");
  } else {
    nav.classList.remove("hide");
  }

  lastScroll = current;
});
</script>

</body>
</html>
