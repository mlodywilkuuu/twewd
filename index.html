<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Białystok</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body {
  background:#0b0f14;
  color:#fff;
}

/* NAV */
nav {
  background:#111821;
  padding:15px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid #1e2a38;
}

.logo {
  font-size:22px;
  font-weight:bold;
  color:#00aaff;
}

/* HERO */
.hero {
  padding:60px 40px;
  background: linear-gradient(to right, #111821, #0b0f14);
}

.hero h1 {
  font-size:42px;
}

.hero p {
  margin-top:10px;
  color:#aaa;
}

/* SEKCJE */
section {
  padding:40px;
}

h2 {
  margin-bottom:20px;
  border-left:4px solid #00aaff;
  padding-left:10px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap:20px;
}

/* KARTY */
.card {
  background:#111821;
  padding:20px;
  border-radius:10px;
  border:1px solid #1e2a38;
  transition:0.2s;
}

.card:hover {
  border-color:#00aaff;
}

/* MECZE */
.match {
  text-align:center;
  font-size:18px;
}

.match b {
  color:#00aaff;
}

/* FOOTER */
footer {
  text-align:center;
  padding:20px;
  color:#777;
  border-top:1px solid #1e2a38;
}
</style>

</head>
<body>

<nav>
  <div class="logo">Legion Białystok</div>
</nav>

<div class="hero">
  <h1>Legion Białystok</h1>
  <p>Oficjalna strona klubu</p>
</div>

<section>
  <h2>Aktualności</h2>
  <div class="grid" id="articles"></div>
</section>

<section>
  <h2>Mecze</h2>
  <div class="grid" id="matches"></div>
</section>

<footer>
  © 2026 Legion Białystok
</footer>

<script>
function loadData() {
  const articles = JSON.parse(localStorage.getItem("articles")) || [];
  const matches = JSON.parse(localStorage.getItem("matches")) || [];

  const artDiv = document.getElementById("articles");
  const matchDiv = document.getElementById("matches");

  artDiv.innerHTML = "";
  matchDiv.innerHTML = "";

  articles.forEach(a => {
    artDiv.innerHTML += `
      <div class="card">
        <h3>${a.title}</h3>
        <p>${a.content}</p>
      </div>
    `;
  });

  matches.forEach(m => {
    matchDiv.innerHTML += `
      <div class="card match">
        ${m.team1} <b>${m.score1} : ${m.score2}</b> ${m.team2}
      </div>
    `;
  });
}

loadData();
</script>

</body>
</html>
