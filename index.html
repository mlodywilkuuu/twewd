<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animowane tło */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #050505, #111111, #1a1504);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Górny pasek nawigacyjny z efektem szkła */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(12, 12, 12, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            z-index: 1000;
        }

        .left-nav {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-container img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #cccccc;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #ffd700;
        }

        /* Styl rozwijanego menu językowego po prawej stronie */
        .lang-dropdown {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .lang-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            list-style: none;
            padding: 8px 0;
            min-width: 140px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* Ukryte domyślnie, z opóźnieniem znikania */
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.2s; /* Nie chowa się za szybko */
        }

        /* Pokazywanie menu po najechaniu na kontener z zapasem czasu */
        .lang-dropdown:hover .lang-menu,
        .lang-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .lang-menu li a {
            display: block;
            padding: 10px 16px;
            color: #cccccc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .lang-menu li a:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        /* Sekcja główna */
        main {
            margin-top: 130px;
            padding: 0 4% 50px 4%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Centrum Meczowe jako pełna sekcja z efektem szkła */
        .match-center {
            width: 100%;
            background: rgba(18, 18, 18, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.18);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .match-center h2 {
            font-size: 1.9rem;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 0 2px 12px rgba(255, 215, 0, 0.25);
        }

        .match-subtitle {
            font-size: 1rem;
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
            font-weight: 600;
        }

        .match-info-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(12, 12, 12, 0.45);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 14px;
            padding: 30px 20px;
        }

        .team {
            flex: 1;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .match-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 25px;
        }

        .score {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffd700;
            letter-spacing: 4px;
            background: rgba(255, 215, 0, 0.06);
            padding: 4px 24px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .match-date {
            font-size: 0.9rem;
            color: #aaaaaa;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header>
        <div class="left-nav">
            <a href="#" class="logo-container">
                <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Legion Białystok Logo">
            </a>
            <ul class="nav-links">
                <li><a href="#">Aktualności</a></li>
                <li><a href="#">Drużyna</a></li>
                <li><a href="#">Mecze</a></li>
                <li><a href="#">Klub</a></li>
            </ul>
        </div>

        <!-- Rozwijane menu wyboru języka z flagami po prawej stronie -->
        <div class="lang-dropdown">
            <button class="lang-btn">🌐 Język</button>
            <ul class="lang-menu">
                <li><a href="#" onclick="changeLang('pl')">🇵🇱 Polski</a></li>
                <li><a href="#" onclick="changeLang('en')">🇬🇧 English</a></li>
                <li><a href="#" onclick="changeLang('es')">🇪🇸 Español</a></li>
                <li><a href="#" onclick="changeLang('ru')">🇷🇺 Русский</a></li>
                <li><a href="#" onclick="changeLang('ar')">🇸🇦 العربية</a></li>
            </ul>
        </div>
    </header>

    <main>
        <div class="match-center">
            <h2>Centrum Meczowe</h2>
            <div class="match-subtitle" id="match-round">IV Liga • Kolejka 14</div>
            
            <div class="match-info-box">
                <div class="team" id="home-team">Legion Białystok</div>
                <div class="match-details">
                    <div class="score" id="match-score">:</div>
                    <div class="match-date" id="match-datetime">Sobota, 18:00</div>
                </div>
                <div class="team" id="away-team">Przeciwnik</div>
            </div>
        </div>
    </main>

    <script>
        // Prosta funkcja do obsługi zmiany języka (możesz rozbudować o własne tłumaczenia)
        function changeLang(lang) {
            console.log("Zmiana języka na: " + lang);
        }
    </script>

</body>
</html>
