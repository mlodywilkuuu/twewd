<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Białystok</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body {
  background:#0b0f14;
  color:#fff;
}

/* ===== MENU WYSPA ===== */
.nav-wrapper {
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:1000;
}

nav {
  display:flex;
  align-items:center;
  gap:25px;
  padding:12px 25px;
  background:#111821;
  border:1px solid #1e2a38;
  border-radius:50px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* linki */
nav a {
  color:#aaa;
  text-decoration:none;
  font-size:14px;
  transition:0.2s;
}

nav a:hover {
  color:#fff;
}

/* logo po LEWEJ */
.logo {
  width:35px;
  height:35px;
}

/* push logo na lewo */
.logo-wrapper {
  margin-right:auto;
}

/* HERO */
.hero {
  padding:120px 40px 60px;
}

.hero h1 {
  font-size:42px;
}

.hero p {
  margin-top:10px;
  color:#aaa;
}

/* SEKCJE */
section {
  padding:40px;
}

h2 {
  margin-bottom:20px;
  border-left:4px solid #00aaff;
  padding-left:10px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap:20px;
}

/* KARTY */
.card {
  background:#111821;
  padding:20px;
  border-radius:10px;
  border:1px solid #1e2a38;
  transition:0.2s;
}

.card:hover {
  border-color:#00aaff;
}

/* MECZE */
.match {
  text-align:center;
  font-size:18px;
}

.match b {
  color:#00aaff;
}

/* FOOTER */
footer {
  text-align:center;
  padding:20px;
  color:#777;
  border-top:1px solid #1e2a38;
}
</style>

</head>
<body>

<!-- MENU -->
<div class="nav-wrapper">
  <nav>

    <!-- LOGO (LEWA STRONA) -->
    <div class="logo-wrapper">
      <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" class="logo">
    </div>

    <a href="#">Strona główna</a>
    <a href="#">Aktualności</a>
    <a href="#">Mecze</a>
    <a href="#">Drużyna</a>

  </nav>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Legion Białystok</h1>
  <p>Oficjalna strona klubu</p>
</div>

<section>
  <h2>Aktualności</h2>
  <div class="grid" id="articles"></div>
</section>

<section>
  <h2>Mecze</h2>
  <div class="grid" id="matches"></div>
</section>

<footer>
  © 2026 Legion Białystok
</footer>

<script>
function loadData() {
  const articles = JSON.parse(localStorage.getItem("articles")) || [];
  const matches = JSON.parse(localStorage.getItem("matches")) || [];

  const artDiv = document.getElementById("articles");
  const matchDiv = document.getElementById("matches");

  artDiv.innerHTML = "";
  matchDiv.innerHTML = "";

  articles.forEach(a => {
    artDiv.innerHTML += `
      <div class="card">
        <h3>${a.title}</h3>
        <p>${a.content}</p>
      </div>
    `;
  });

  matches.forEach(m => {
    matchDiv.innerHTML += `
      <div class="card match">
        ${m.team1} <b>${m.score1} : ${m.score2}</b> ${m.team2}
      </div>
    `;
  });
}

loadData();
</script>

</body>
</html>
