<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Białystok</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  background:#0b0f14;
  color:white;
}

/* ===== NAV ===== */
nav{
  position:fixed;
  width:100%;
  top:0;
  left:0;
  padding:15px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(10,15,20,0.85);
  backdrop-filter:blur(8px);
  z-index:1000;
}

.logo{
  width:40px;
}

.menu a{
  color:#ccc;
  margin-left:20px;
  text-decoration:none;
  font-size:14px;
}

.menu a:hover{
  color:white;
}

/* ===== HERO ===== */
.hero{
  height:90vh;
  background:url("https://images.unsplash.com/photo-1508098682722-e99c643e7f0b") center/cover;
  display:flex;
  align-items:flex-end;
  padding:60px;
}

.hero-content{
  max-width:500px;
}

.hero h1{
  font-size:48px;
}

.hero p{
  margin-top:10px;
  color:#ccc;
}

/* ===== BUTTON ===== */
.btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  background:white;
  color:black;
  text-decoration:none;
  font-weight:bold;
}

/* ===== SEKCJE ===== */
section{
  padding:50px 40px;
}

.section-title{
  font-size:22px;
  margin-bottom:20px;
}

/* ===== NEWS GRID ===== */
.news{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:15px;
}

.news .big{
  grid-row:span 2;
  height:300px;
}

.news div{
  background:#111;
  padding:15px;
}

/* ===== MATCH ===== */
.matches{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.match{
  background:#111;
  padding:20px;
  flex:1;
  min-width:200px;
  text-align:center;
}

.match b{
  color:#00aaff;
}

/* ===== FOOTER ===== */
footer{
  padding:30px;
  text-align:center;
  color:#777;
}

</style>
</head>

<body>

<nav>
  <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" class="logo">
  <div class="menu">
    <a href="#">Home</a>
    <a href="#">News</a>
    <a href="#">Matches</a>
    <a href="#">Club</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <h1>Legion Białystok</h1>
    <p>Oficjalna strona klubu</p>
    <a href="#" class="btn">Zobacz więcej</a>
  </div>
</div>

<!-- NEWS -->
<section>
  <div class="section-title">Aktualności</div>
  <div class="news" id="articles"></div>
</section>

<!-- MATCHES -->
<section>
  <div class="section-title">Mecze</div>
  <div class="matches" id="matches"></div>
</section>

<footer>
  © 2026 Legion Białystok
</footer>

<script>
function loadData(){
  const articles = JSON.parse(localStorage.getItem("articles")) || [];
  const matches = JSON.parse(localStorage.getItem("matches")) || [];

  const artDiv = document.getElementById("articles");
  const matchDiv = document.getElementById("matches");

  artDiv.innerHTML = "";
  matchDiv.innerHTML = "";

  articles.forEach((a,i)=>{
    artDiv.innerHTML += `
      <div class="${i==0?'big':''}">
        <h3>${a.title}</h3>
        <p>${a.content}</p>
      </div>
    `;
  });

  matches.forEach(m=>{
    matchDiv.innerHTML += `
      <div class="match">
        ${m.team1} <b>${m.score1}:${m.score2}</b> ${m.team2}
      </div>
    `;
  });
}

loadData();
</script>

</body>
</html>
