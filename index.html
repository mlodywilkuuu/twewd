<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Białystok</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#1e293b',
                            accent: '#eab308',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-brand-accent selection:text-slate-950">

    <!-- HEADER / MENU -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                
                <!-- LOGO / NAZWA KLUBU -->
                <div class="flex-shrink-0 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-brand-accent flex items-center justify-center font-black text-slate-950 text-xl">
                        LB
                    </div>
                    <a href="#home" class="text-xl font-bold tracking-wider uppercase">
                        Legion <span class="text-brand-accent">Białystok</span>
                    </a>
                </div>

                <!-- NAWIGACJA DESKTOP -->
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="#home" class="text-sm font-medium hover:text-brand-accent transition-colors">Start</a>
                    <a href="#o-nas" class="text-sm font-medium hover:text-brand-accent transition-colors">O nas</a>
                    <a href="#terminarz" class="text-sm font-medium hover:text-brand-accent transition-colors">Terminarz</a>
                    <a href="#kadra" class="text-sm font-medium hover:text-brand-accent transition-colors">Kadra</a>
                    <a href="#kontakt" class="text-sm font-medium hover:text-brand-accent transition-colors">Kontakt</a>
                </nav>

                <!-- PRZYCISK CTA -->
                <div class="hidden md:block">
                    <a href="#kontakt" class="px-4 py-2 text-sm font-semibold bg-brand-accent text-slate-950 rounded-lg hover:bg-yellow-400 transition-all shadow-lg shadow-yellow-500/10">
                        Dołącz do nas
                    </a>
                </div>

                <!-- PRZYCISK MENU MOBILNEGO -->
                <div class="flex md:hidden">
                    <button id="mobile-menu-button" type="button" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- MENU MOBILNE -->
        <div id="mobile-menu" class="hidden md:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-6 space-y-3">
            <a href="#home" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-slate-800 hover:text-brand-accent">Start</a>
            <a href="#o-nas" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-slate-800 hover:text-brand-accent">O nas</a>
            <a href="#terminarz" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-slate-800 hover:text-brand-accent">Terminarz</a>
            <a href="#kadra" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-slate-800 hover:text-brand-accent">Kadra</a>
            <a href="#kontakt" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-slate-800 hover:text-brand-accent">Kontakt</a>
            <div class="pt-2">
                <a href="#kontakt" class="w-full block text-center px-4 py-2 text-sm font-semibold bg-brand-accent text-slate-950 rounded-lg">
                    Dołącz do nas
                </a>
            </div>
        </div>
    </header>

    <!-- SEKCJE STRONY -->
    <main class="pt-20">
        <section id="home" class="min-h-screen flex items-center justify-center border-b border-slate-900">
            <h1 class="text-4xl font-black tracking-wider">Sekcja START</h1>
        </section>
        <section id="o-nas" class="min-h-screen flex items-center justify-center border-b border-slate-900">
            <h1 class="text-4xl font-black tracking-wider">Sekcja O NAS</h1>
        </section>
        <section id="terminarz" class="min-h-screen flex items-center justify-center border-b border-slate-900">
            <h1 class="text-4xl font-black tracking-wider">Sekcja TERMINARZ</h1>
        </section>
        <section id="kadra" class="min-h-screen flex items-center justify-center border-b border-slate-900">
            <h1 class="text-4xl font-black tracking-wider">Sekcja KADRA</h1>
        </section>
        <section id="kontakt" class="min-h-screen flex items-center justify-center">
            <h1 class="text-4xl font-black tracking-wider">Sekcja KONTAKT</h1>
        </section>
    </main>

    <!-- SKRYPT MENU -->
    <script>
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });

        const mobileLinks = menu.querySelectorAll('a');
        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                menu.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
