<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Białystok</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  color:white;
}

/* ===== ANIMOWANY GRADIENT ===== */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background: linear-gradient(-45deg, #0b0f14, #1a2a44, #0b0f14, #162033);
  background-size:400% 400%;
  animation: gradient 10s ease infinite;
  z-index:-1;
}

@keyframes gradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ===== MAINTENANCE SCREEN ===== */
.maintenance{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.logo{
  width:120px;
  margin-bottom:20px;
}

.maintenance h1{
  font-size:28px;
  margin-bottom:10px;
}

.maintenance p{
  color:#ccc;
}

/* ===== UKRYTY PRZYCISK ===== */
.hidden-btn{
  position:fixed;
  top:0;
  right:0;
  width:60px;
  height:60px;
  opacity:0;
  cursor:pointer;
}

/* ===== PRAWDZIWA STRONA ===== */
.main-site{
  display:none;
  padding:40px;
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- UKRYTY PRZYCISK -->
<div class="hidden-btn" onclick="showSite()"></div>

<!-- MAINTENANCE -->
<div class="maintenance" id="maintenance">
  <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" class="logo">
  <h1>Legion Białystok</h1>
  <p>Prace techniczne</p>
</div>

<!-- PRAWDZIWA STRONA -->
<div class="main-site" id="mainSite">
  <h1>Strona działa 🔥</h1>
  <p>Tu później wrzucisz swoją normalną stronę</p>
</div>

<script>
function showSite(){
  document.getElementById("maintenance").style.display = "none";
  document.getElementById("mainSite").style.display = "block";
}
</script>

</body>
</html>
