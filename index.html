<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
        }

        /* Pasek menu */
        header {
            width: 100%;
            background-color: #000000;
            border-bottom: 1px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            height: 85px;
        }

        /* Lewa strona: Logo + przyciski obok */
        .left-section {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .logo-container img {
            height: 55px;
            width: auto;
            object-fit: contain;
        }

        /* Minimalistyczne przyciski menu (bez ramek) */
        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: none;
            border: none;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }

        /* Prawa strona: Menu tłumaczeń wysuwane po najechaniu (Hover) */
        .lang-dropdown {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #d4af37;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            transition: color 0.3s ease;
        }

        .lang-dropdown:hover .lang-btn {
            color: #ffffff;
        }

        .lang-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background-color: #121212;
            border: 1px solid #d4af37;
            border-radius: 6px;
            width: 180px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 30px rgba(0,0,0,0.9);
            z-index: 1000;
            overflow: hidden;
            
            /* Płynne chowanie i pokazywanie */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
        }

        /* Pokazywanie menu po najechaniu na kontener */
        .lang-dropdown:hover .lang-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .lang-option {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .lang-option:hover {
            background-color: rgba(212, 175, 55, 0.15);
            color: #d4af37;
        }

        .lang-option img {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <header>
        <!-- Lewa strona: Logo + Minimalistyczne przyciski -->
        <div class="left-section">
            <div class="logo-container">
                <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Legion Białystok Logo">
            </div>
            <nav>
                <a href="#">Strona Główna</a>
                <a href="#">Drużyna</a>
                <a href="#">Terminarz</a>
                <a href="#">Wyniki</a>
                <a href="#">Bilety</a>
                <a href="#">Kontakt</a>
            </nav>
        </div>

        <!-- Prawa strona: Rozwijane menu tłumaczeń (po najechaniu) z 5 językami -->
        <div class="lang-dropdown">
            <div class="lang-btn">
                <img src="https://flagcdn.com/w40/pl.png" alt="PL" id="currentFlag" style="width:20px; height:14px; border-radius:2px;">
                <span id="currentLangText">PL</span>
                <span>▼</span>
            </div>
            <div class="lang-menu">
                <div class="lang-option" onclick="changeLanguage('pl', 'PL', 'https://flagcdn.com/w40/pl.png')">
                    <img src="https://flagcdn.com/w40/pl.png" alt="PL"> Polski
                </div>
                <div class="lang-option" onclick="changeLanguage('en', 'EN', 'https://flagcdn.com/w40/gb.png')">
                    <img src="https://flagcdn.com/w40/gb.png" alt="EN"> English
                </div>
                <div class="lang-option" onclick="changeLanguage('ru', 'RU', 'https://flagcdn.com/w40/ru.png')">
                    <img src="https://flagcdn.com/w40/ru.png" alt="RU"> Русский
                </div>
                <div class="lang-option" onclick="changeLanguage('es', 'ES', 'https://flagcdn.com/w40/es.png')">
                    <img src="https://flagcdn.com/w40/es.png" alt="ES"> Español
                </div>
                <div class="lang-option" onclick="changeLanguage('ar', 'AR', 'https://flagcdn.com/w40/sa.png')">
                    <img src="https://flagcdn.com/w40/sa.png" alt="AR"> العربية
                </div>
            </div>
        </div>
    </header>

    <script>
        // Funkcja zmieniająca aktywną flagę i język po kliknięciu
        function changeLanguage(langCode, langName, flagUrl) {
            document.getElementById('currentFlag').src = flagUrl;
            document.getElementById('currentLangText').innerText = langName;
            
            // Tutaj możesz wpiąć własną logikę obsługującą zmianę języka na stronie
        }
    </script>

</body>
</html>
