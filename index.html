<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animowane tło */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #050505, #141414, #1f1905);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Górny pasek nawigacyjny */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-container img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        .club-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #cccccc;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #ffd700;
        }

        /* Sekcja główna */
        main {
            margin-top: 110px;
            padding: 0 5% 50px 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Centrum Meczowe - wersja pełna szerokość */
        .match-center {
            width: 100%;
            max-width: 1000px;
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        .match-center h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.2);
        }

        .match-subtitle {
            font-size: 0.95rem;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .match-info-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px 20px;
        }

        .team {
            flex: 1;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .match-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        .score {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffd700;
            letter-spacing: 2px;
            background: rgba(255, 215, 0, 0.05);
            padding: 5px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .match-date {
            font-size: 0.85rem;
            color: #888888;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header>
        <a href="#" class="logo-container">
            <img src="logo.png" alt="Legion Białystok Logo" onerror="this.style.display='none'">
            <span class="club-name">Legion Białystok</span>
        </a>
        <ul class="nav-links">
            <li><a href="#">Aktualności</a></li>
            <li><a href="#">Drużyna</a></li>
            <li><a href="#">Mecze</a></li>
            <li><a href="#">Klub</a></li>
        </ul>
    </header>

    <main>
        <div class="match-center">
            <h2>Centrum Meczowe</h2>
            <div class="match-subtitle">IV Liga • Kolejka 14</div>
            
            <div class="match-info-box">
                <div class="team">Legion Białystok</div>
                <div class="match-details">
                    <div class="score">0 : 0</div>
                    <div class="match-date">Sobota, 18:00</div>
                </div>
                <div class="team">Przeciwnik</div>
            </div>
        </div>
    </main>

</body>
</html>
