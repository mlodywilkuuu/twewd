<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Białystok</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body {
  color:#fff;
  min-height:100vh;
  background: radial-gradient(circle at top, #1a2a44, #0b0f14 60%);
}

/* ===== MENU WYSPA (TRANSPARENT) ===== */
.nav-wrapper {
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:1000;
}

nav {
  display:flex;
  align-items:center;
  gap:25px;
  padding:10px 20px;
  border-radius:50px;

  background: rgba(20,25,35,0.6);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.08);
}

/* logo */
.logo {
  width:32px;
}

/* logo left */
.logo-wrapper {
  margin-right:auto;
}

/* linki */
nav a {
  color:#ccc;
  text-decoration:none;
  font-size:14px;
  padding:6px 10px;
  border-radius:20px;
  transition:0.2s;
}

nav a:hover {
  background: rgba(255,255,255,0.1);
  color:#fff;
}

/* HERO */
.hero {
  padding:120px 40px 50px;
}

.hero h1 {
  font-size:44px;
  margin-bottom:10px;
}

.hero p {
  color:#aaa;
}

/* BUTTON */
.btn {
  display:inline-block;
  margin-top:20px;
  padding:10px 18px;
  border-radius:25px;
  text-decoration:none;
  font-size:14px;
  background: linear-gradient(135deg, #00aaff, #0066ff);
  color:white;
  transition:0.2s;
}

.btn:hover {
  transform:translateY(-2px);
  opacity:0.9;
}

/* SEKCJE */
section {
  padding:40px;
}

h2 {
  margin-bottom:20px;
  border-left:4px solid #00aaff;
  padding-left:10px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap:20px;
}

/* KARTY */
.card {
  background: rgba(20,25,35,0.7);
  border-radius:12px;
  padding:20px;
  border:1px solid rgba(255,255,255,0.05);
  transition:0.2s;
}

.card:hover {
  border-color:#00aaff;
  transform:translateY(-3px);
}

/* MECZE */
.match {
  text-align:center;
  font-size:18px;
}

.match b {
  color:#00aaff;
}

/* FOOTER */
footer {
  text-align:center;
  padding:20px;
  color:#777;
}
</style>

</head>
<body>

<!-- MENU -->
<div class="nav-wrapper">
  <nav>

    <div class="logo-wrapper">
      <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" class="logo">
    </div>

    <a href="#">Home</a>
    <a href="#">News</a>
    <a href="#">Matches</a>
    <a href="#">Team</a>

  </nav>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Legion Białystok</h1>
  <p>Oficjalna strona klubu</p>
  <a href="#" class="btn">Zobacz więcej</a>
</div>

<section>
  <h2>Aktualności</h2>
  <div class="grid" id="articles"></div>
</section>

<section>
  <h2>Mecze</h2>
  <div class="grid" id="matches"></div>
</section>

<footer>
  © 2026 Legion Białystok
</footer>

<script>
function loadData() {
  const articles = JSON.parse(localStorage.getItem("articles")) || [];
  const matches = JSON.parse(localStorage.getItem("matches")) || [];

  const artDiv = document.getElementById("articles");
  const matchDiv = document.getElementById("matches");

  artDiv.innerHTML = "";
  matchDiv.innerHTML = "";

  articles.forEach(a => {
    artDiv.innerHTML += `
      <div class="card">
        <h3>${a.title}</h3>
        <p>${a.content}</p>
      </div>
    `;
  });

  matches.forEach(m => {
    matchDiv.innerHTML += `
      <div class="card match">
        ${m.team1} <b>${m.score1} : ${m.score2}</b> ${m.team2}
      </div>
    `;
  });
}

loadData();
</script>

</body>
</html>
