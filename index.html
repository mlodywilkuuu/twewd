<!DOCTYPE html>
<html lang="pl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Nowoczesny, elegancki, ciemno-złoty animowany gradient w tle */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0b0b0b, #141414, #26210f, #1a160a, #0b0b0b);
            background-size: 400% 400%;
            animation: gradientAnimation 18s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Pasek menu całkowicie przezroczysty – gradient przechodzi swobodnie pod spodem */
        header {
            width: 100%;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            height: 90px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        /* Lewa strona: Logo + Minimalistyczne przyciski */
        .left-section {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .logo-container img {
            height: 52px;
            width: auto;
            object-fit: contain;
        }

        /* Minimalistyczne przyciski menu */
        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #e6c687;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: none;
            border: none;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 12px rgba(230, 198, 135, 0.7);
        }

        /* Prawa strona: Menu tłumaczeń z pełną widocznością tła */
        .lang-dropdown {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(230, 198, 135, 0.3);
            border-radius: 6px;
            color: #e6c687;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            transition: all 0.3s ease;
        }

        .lang-dropdown:hover .lang-btn {
            background: rgba(230, 198, 135, 0.1);
            border-color: #e6c687;
            color: #ffffff;
        }

        .lang-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background-color: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(230, 198, 135, 0.3);
            border-radius: 6px;
            width: 180px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            overflow: hidden;
            
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
        }

        .lang-dropdown:hover .lang-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .lang-option {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .lang-option:hover {
            background-color: rgba(230, 198, 135, 0.2);
            color: #e6c687;
        }

        .lang-option img {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <header>
        <!-- Lewa strona: Logo + Minimalistyczne przyciski -->
        <div class="left-section">
            <div class="logo-container">
                <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Legion Białystok Logo">
            </div>
            <nav>
                <a href="#" data-i18n="home">Strona Główna</a>
                <a href="#" data-i18n="team">Drużyna</a>
                <a href="#" data-i18n="fixtures">Terminarz</a>
                <a href="#" data-i18n="results">Wyniki</a>
                <a href="#" data-i18n="tickets">Bilety</a>
                <a href="#" data-i18n="contact">Kontakt</a>
            </nav>
        </div>

        <!-- Prawa strona: Rozwijane menu tłumaczeń -->
        <div class="lang-dropdown">
            <div class="lang-btn">
                <img src="https://flagcdn.com/w40/pl.png" alt="PL" id="currentFlag" style="width:20px; height:14px; border-radius:2px;">
                <span id="currentLangText">PL</span>
                <span>▼</span>
            </div>
            <div class="lang-menu">
                <div class="lang-option" onclick="changeLanguage('pl', 'PL', 'https://flagcdn.com/w40/pl.png', 'ltr')">
                    <img src="https://flagcdn.com/w40/pl.png" alt="PL"> Polski
                </div>
                <div class="lang-option" onclick="changeLanguage('en', 'EN', 'https://flagcdn.com/w40/gb.png', 'ltr')">
                    <img src="https://flagcdn.com/w40/gb.png" alt="EN"> English
                </div>
                <div class="lang-option" onclick="changeLanguage('ru', 'RU', 'https://flagcdn.com/w40/ru.png', 'ltr')">
                    <img src="https://flagcdn.com/w40/ru.png" alt="RU"> Русский
                </div>
                <div class="lang-option" onclick="changeLanguage('es', 'ES', 'https://flagcdn.com/w40/es.png', 'ltr')">
                    <img src="https://flagcdn.com/w40/es.png" alt="ES"> Español
                </div>
                <div class="lang-option" onclick="changeLanguage('ar', 'AR', 'https://flagcdn.com/w40/sa.png', 'rtl')">
                    <img src="https://flagcdn.com/w40/sa.png" alt="AR"> العربية
                </div>
            </div>
        </div>
    </header>

    <script>
        const translations = {
            pl: { home: "Strona Główna", team: "Drużyna", fixtures: "Terminarz", results: "Wyniki", tickets: "Bilety", contact: "Kontakt" },
            en: { home: "Home", team: "Team", fixtures: "Fixtures", results: "Results", tickets: "Tickets", contact: "Contact" },
            ru: { home: "Главная", team: "Команда", fixtures: "Матчи", results: "Результаты", tickets: "Билеты", contact: "Контакты" },
            es: { home: "Inicio", team: "Equipo", fixtures: "Calendario", results: "Resultados", tickets: "Entradas", contact: "Contacto" },
            ar: { home: "الرئيسية", team: "الفريق", fixtures: "المباريات", results: "النتائج", tickets: "التذاكر", contact: "اتصل بنا" }
        };

        function changeLanguage(langCode, langName, flagUrl, dir) {
            document.getElementById('currentFlag').src = flagUrl;
            document.getElementById('currentLangText').innerText = langName;
            
            document.getElementById('htmlRoot').setAttribute('lang', langCode);
            document.getElementById('htmlRoot').setAttribute('dir', dir);

            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[langCode] && translations[langCode][key]) {
                    el.innerText = translations[langCode][key];
                }
            });
        }
    </script>

</body>
</html>
