<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Białystok</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', Arial, sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  color:white;
}

/* ===== TŁO ===== */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background: linear-gradient(-45deg, #0b0f14, #162033, #0b0f14, #1a2a44);
  background-size:400% 400%;
  animation: gradient 12s ease infinite;
  z-index:-1;
}

@keyframes gradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ===== MAINTENANCE ===== */
.maintenance{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  max-width:400px;
}

.logo{
  width:110px;
  margin-bottom:25px;
}

.status{
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:3px;
  color:#00aaff;
  margin-bottom:15px;
}

.line{
  width:60px;
  height:2px;
  background:#00aaff;
  margin:15px auto;
  opacity:0.7;
}

.desc{
  color:#aaa;
  font-size:14px;
}

/* ===== UKRYTY PRZYCISK ===== */
.hidden-btn{
  position:fixed;
  top:0;
  right:0;
  width:70px;
  height:70px;
  opacity:0;
  cursor:pointer;
}

/* ===== STRONA ===== */
.main-site{
  display:none;
  padding-top:80px;
}

/* ===== MENU (TOP BAR) ===== */
nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:30px;
  padding:15px;
  background:rgba(10,15,20,0.5);
  backdrop-filter:blur(8px);
  transition:0.3s;
  z-index:1000;
}

/* ukrywanie menu */
nav.hide{
  transform:translateY(-100%);
}

nav a{
  color:#ccc;
  text-decoration:none;
  font-size:14px;
  transition:0.2s;
}

nav a:hover{
  color:white;
}

/* SEKCJA DEMO */
.section{
  height:100vh;
  padding:40px;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- UKRYTY PRZYCISK -->
<div class="hidden-btn" onclick="showSite()"></div>

<!-- MAINTENANCE -->
<div class="maintenance" id="maintenance">
  <img src="8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" class="logo">
  <div class="line"></div>
  <div class="status">Prace techniczne</div>
  <div class="desc">Strona jest chwilowo niedostępna</div>
</div>

<!-- STRONA -->
<div class="main-site" id="mainSite">

  <nav id="navbar">
    <a href="#">Home</a>
    <a href="#">News</a>
    <a href="#">Matches</a>
    <a href="#">Team</a>
  </nav>

  <div class="section"></div>
  <div class="section"></div>
  <div class="section"></div>

</div>

<script>
function showSite(){
  document.getElementById("maintenance").style.display = "none";
  document.getElementById("mainSite").style.display = "block";
  document.body.style.overflow = "auto";
}

/* ===== SCROLL HIDE MENU ===== */
let lastScroll = 0;
const nav = document.getElementById("navbar");

window.addEventListener("scroll", () => {
  const currentScroll = window.pageYOffset;

  if(currentScroll > lastScroll){
    nav.classList.add("hide"); // scroll w dół
  } else {
    nav.classList.remove("hide"); // scroll w górę
  }

  lastScroll = currentScroll;
});
</script>

</body>
</html>
