<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administratora - Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060606;
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Ekran logowania */
        .login-screen {
            max-width: 400px;
            margin: 100px auto;
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(10, 10, 10, 0.95));
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            text-align: center;
        }

        .login-logo {
            height: 70px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .login-screen h2 {
            color: #ffd700;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .login-screen input {
            width: 100%;
            margin-bottom: 15px;
        }

        .admin-panel {
            display: none;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 30px;
        }

        .admin-header img {
            height: 50px;
            object-fit: contain;
        }

        .admin-header h1 {
            color: #ffd700;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logout-btn {
            background: #ff4d4d !important;
            color: white !important;
            width: auto !important;
            grid-column: auto !important;
        }

        .section-box {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            color: #ffd700;
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            padding-bottom: 10px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        input, select, textarea {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        button {
            background: linear-gradient(135deg, #ffd700, #cca600);
            color: #000000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            grid-column: 1 / -1;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            background: rgba(30, 30, 30, 0.6);
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            grid-column: auto;
        }

        .delete-btn:hover {
            background: #ff1a1a;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- EKRAN LOGOWANIA -->
        <div class="login-screen" id="loginScreen">
            <img src="../8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Logo Legion" class="login-logo">
            <h2>Panel Administratora</h2>
            <form onsubmit="handleLogin(event)" style="display: block;">
                <input type="text" id="loginUser" placeholder="Login" required style="width: 100%; margin-bottom: 15px;">
                <input type="password" id="loginPass" placeholder="Hasło" required style="width: 100%; margin-bottom: 20px;">
                <button type="submit" style="width: 100%;">Zaloguj się</button>
            </form>
            <p id="loginError" style="color: #ff4d4d; margin-top: 15px; font-size: 0.9rem; display: none;">Niepoprawny login lub hasło!</p>
        </div>

        <!-- PANEL ADMINISTRATORA -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <img src="../8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Logo">
                    <h1>Zarządzanie Klubem</h1>
                </div>
                <button class="logout-btn" onclick="handleLogout()">Wyloguj</button>
            </div>

            <!-- Zmiana Hasła -->
            <div class="section-box">
                <h2>Zmiana Hasła</h2>
                <form onsubmit="changePassword(event)">
                    <input type="password" id="newPass" placeholder="Nowe hasło" required>
                    <button type="submit">Zmień hasło</button>
                </form>
            </div>

            <!-- Zarządzanie Permisjami / Użytkownikami -->
            <div class="section-box">
                <h2>Nadawanie Permisji (Użytkownicy)</h2>
                <form onsubmit="addUser(event)">
                    <input type="text" id="u-name" placeholder="Login użytkownika" required>
                    <select id="u-role">
                        <option value="admin">Administrator (Pełne uprawnienia)</option>
                        <option value="editor">Edytor (Artykuły i Składy)</option>
                    </select>
                    <button type="submit">Dodaj użytkownika / Zmień uprawnienia</button>
                </form>
                <div class="item-list" id="list-users"></div>
            </div>

            <!-- Pierwsza Drużyna -->
            <div class="section-box">
                <h2>Zarządzanie: Pierwsza Drużyna</h2>
                <form onsubmit="addPlayer(event, 'legion_first_team')">
                    <input type="text" id="t-name" placeholder="Imię i nazwisko" required>
                    <input type="text" id="t-position" placeholder="Pozycja" required>
                    <input type="number" id="t-age" placeholder="Wiek" required>
                    <input type="number" id="t-number" placeholder="Numer" required>
                    <input type="number" id="t-matches" placeholder="Mecze" required>
                    <input type="number" id="t-goals" placeholder="Gole" required>
                    <button type="submit">Dodaj zawodnika do 1. Drużyny</button>
                </form>
                <div class="item-list" id="list-legion_first_team"></div>
            </div>

            <!-- Akademia -->
            <div class="section-box">
                <h2>Zarządzanie: Akademia</h2>
                <form onsubmit="addPlayer(event, 'legion_academy_players')">
                    <input type="text" id="a-name" placeholder="Imię i nazwisko" required>
                    <input type="text" id="a-position" placeholder="Pozycja" required>
                    <input type="number" id="a-age" placeholder="Wiek" required>
                    <input type="number" id="a-number" placeholder="Numer" required>
                    <input type="number" id="a-matches" placeholder="Mecze" required>
                    <input type="number" id="a-goals" placeholder="Gole" required>
                    <button type="submit">Dodaj zawodnika do Akademii</button>
                </form>
                <div class="item-list" id="list-legion_academy_players"></div>
            </div>

            <!-- Artykuły -->
            <div class="section-box">
                <h2>Zarządzanie: Artykuły</h2>
                <form onsubmit="addArticle(event)">
                    <input type="text" id="art-title" placeholder="Tytuł artykułu" required style="grid-column: 1 / -1;">
                    <input type="text" id="art-tags" placeholder="Tagi (np. Drużyna, Klub)" required>
                    <input type="text" id="art-date" placeholder="Data (np. 2026-03-29 14:00)" required>
                    <textarea id="art-content" placeholder="Treść artykułu" required style="grid-column: 1 / -1; height: 80px;"></textarea>
                    <button type="submit">Dodaj Artykuł</button>
                </form>
                <div class="item-list" id="list-articles"></div>
            </div>

            <!-- Tabele i Tagi Lig -->
            <div class="section-box">
                <h2>Zarządzanie Tabelami (Tagi / Ligi)</h2>
                <form onsubmit="addTableLeague(event)">
                    <input type="text" id="league-tag" placeholder="Nazwa Ligi / Sezonu (Tag)" required style="grid-column: 1 / -1;">
                    <textarea id="league-data" placeholder="Dane tabeli / wiersze" required style="grid-column: 1 / -1; height: 80px;"></textarea>
                    <button type="submit">Zapisz Tabelę dla Ligi</button>
                </form>
                <div class="item-list" id="list-leagues"></div>
            </div>

        </div>

    </div>

    <script>
        // Inicjalizacja domyślnego konta administratora
        function initAuth() {
            let users = JSON.parse(localStorage.getItem('legion_users')) || {
                'mpiotrowski': { pass: 'Jaga1920', role: 'admin' }
            };
            localStorage.setItem('legion_users', JSON.stringify(users));

            if (localStorage.getItem('legion_logged_in') === 'true') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadPanelData();
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            let users = JSON.parse(localStorage.getItem('legion_users')) || {};

            if (users[user] && users[user].pass === pass) {
                localStorage.setItem('legion_logged_in', 'true');
                localStorage.setItem('legion_current_user', user);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadPanelData();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('legion_logged_in');
            localStorage.removeItem('legion_current_user');
            window.location.reload();
        }

        function changePassword(event) {
            event.preventDefault();
            const newPass = document.getElementById('newPass').value.trim();
            const currentUser = localStorage.getItem('legion_current_user') || 'mpiotrowski';

            let users = JSON.parse(localStorage.getItem('legion_users')) || {};
            if (users[currentUser]) {
                users[currentUser].pass = newPass;
                localStorage.setItem('legion_users', JSON.stringify(users));
                alert('Hasło zostało pomyślnie zmienione!');
                event.target.reset();
            }
        }

        function addUser(event) {
            event.preventDefault();
            const name = document.getElementById('u-name').value.trim();
            const role = document.getElementById('u-role').value;

            let users = JSON.parse(localStorage.getItem('legion_users')) || {};
            users[name] = { pass: users[name]?.pass || '123456', role: role };
            localStorage.setItem('legion_users', JSON.stringify(users));

            event.target.reset();
            renderUsers();
        }

        function deleteUser(name) {
            if (name === 'mpiotrowski') {
                alert('Nie można usunąć głównego administratora!');
                return;
            }
            let users = JSON.parse(localStorage.getItem('legion_users')) || {};
            delete users[name];
            localStorage.setItem('legion_users', JSON.stringify(users));
            renderUsers();
        }

        function renderUsers() {
            const container = document.getElementById('list-users');
            if(!container) return;
            container.innerHTML = '';
            let users = JSON.parse(localStorage.getItem('legion_users')) || {};

            for (let [name, info] of Object.entries(users)) {
                container.innerHTML += `
                    <div class="item-row">
                        <span><strong>${name}</strong> (${info.role.toUpperCase()})</span>
                        ${name !== 'mpiotrowski' ? `<button class="delete-btn" onclick="deleteUser('${name}')">Usuń</button>` : ''}
                    </div>
                `;
            }
        }

        function loadPanelData() {
            renderUsers();
            renderPlayers('legion_first_team');
            renderPlayers('legion_academy_players');
            renderArticles();
            renderLeagues();
        }

        // --- ZAWODNICY ---
        function addPlayer(event, storageKey) {
            event.preventDefault();
            const prefix = storageKey === 'legion_first_team' ? 't-' : 'a-';
            
            const player = {
                id: 'p_' + Date.now(),
                name: document.getElementById(prefix + 'name').value,
                position: document.getElementById(prefix + 'position').value,
                age: document.getElementById(prefix + 'age').value,
                number: document.getElementById(prefix + 'number').value,
                matches: document.getElementById(prefix + 'matches').value,
                goals: document.getElementById(prefix + 'goals').value
            };

            let data = JSON.parse(localStorage.getItem(storageKey)) || [];
            data.push(player);
            localStorage.setItem(storageKey, JSON.stringify(data));

            event.target.reset();
            renderPlayers(storageKey);
        }

        function deletePlayer(storageKey, id) {
            let data = JSON.parse(localStorage.getItem(storageKey)) || [];
            data = data.filter(p => p.id !== id);
            localStorage.setItem(storageKey, JSON.stringify(data));
            renderPlayers(storageKey);
        }

        function renderPlayers(storageKey) {
            const container = document.getElementById('list-' + storageKey);
            if (!container) return;
            container.innerHTML = '';
            
            let data = JSON.parse(localStorage.getItem(storageKey)) || [];
            if (data.length === 0) {
                container.innerHTML = '<p style="color: #777; font-size: 0.9rem;">Brak zawodników.</p>';
                return;
            }

            data.forEach(p => {
                container.innerHTML += `
                    <div class="item-row">
                        <span><strong>${p.name}</strong> (${p.position}) - Nr ${p.number}</span>
                        <button class="delete-btn" onclick="deletePlayer('${storageKey}', '${p.id}')">Usuń</button>
                    </div>
                `;
            });
        }

        // --- ARTYKUŁY ---
        function addArticle(event) {
            event.preventDefault();
            const article = {
                id: 'art_' + Date.now(),
                title: document.getElementById('art-title').value,
                tags: document.getElementById('art-tags').value,
                date: document.getElementById('art-date').value,
                content: document.getElementById('art-content').value
            };

            let data = JSON.parse(localStorage.getItem('legion_news')) || [];
            data.push(article);
            localStorage.setItem('legion_news', JSON.stringify(data));

            event.target.reset();
            renderArticles();
        }

        function deleteArticle(id) {
            let data = JSON.parse(localStorage.getItem('legion_news')) || [];
            data = data.filter(a => a.id !== id);
            localStorage.setItem('legion_news', JSON.stringify(data));
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById('list-articles');
            if(!container) return;
            container.innerHTML = '';
            let data = JSON.parse(localStorage.getItem('legion_news')) || [];
            
            if (data.length === 0) {
                container.innerHTML = '<p style="color: #777; font-size: 0.9rem;">Brak artykułów.</p>';
                return;
            }

            data.forEach(a => {
                container.innerHTML += `
                    <div class="item-row">
                        <span><strong>${a.title}</strong> [${a.tags}]</span>
                        <button class="delete-btn" onclick="deleteArticle('${a.id}')">Usuń</button>
                    </div>
                `;
            });
        }

        // --- TABELE I LIGI ---
        function addTableLeague(event) {
            event.preventDefault();
            const tag = document.getElementById('league-tag').value.trim();
            const content = document.getElementById('league-data').value;

            let leagues = JSON.parse(localStorage.getItem('legion_leagues_tables')) || {};
            leagues[tag] = content;
            localStorage.setItem('legion_leagues_tables', JSON.stringify(leagues));

            event.target.reset();
            renderLeagues();
        }

        function deleteLeagueTable(tag) {
            let leagues = JSON.parse(localStorage.getItem('legion_leagues_tables')) || {};
            delete leagues[tag];
            localStorage.setItem('legion_leagues_tables', JSON.stringify(leagues));
            renderLeagues();
        }

        function renderLeagues() {
            const container = document.getElementById('list-leagues');
            if(!container) return;
            container.innerHTML = '';
            let leagues = JSON.parse(localStorage.getItem('legion_leagues_tables')) || {};
            const keys = Object.keys(leagues);

            if (keys.length === 0) {
                container.innerHTML = '<p style="color: #777; font-size: 0.9rem;">Brak zapisanych tabel ligowych.</p>';
                return;
            }

            keys.forEach(tag => {
                container.innerHTML += `
                    <div class="item-row">
                        <span><strong>Liga / Tag:</strong> ${tag}</span>
                        <button class="delete-btn" onclick="deleteLeagueTable('${tag}')">Usuń Tabelę</button>
                    </div>
                `;
            });
        }

        window.addEventListener('DOMContentLoaded', initAuth);
    </script>
</body>
</html>
