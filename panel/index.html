<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administratora - Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060606;
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-box {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            color: #ffd700;
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            padding-bottom: 10px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        input, select, textarea {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        button {
            background: linear-gradient(135deg, #ffd700, #cca600);
            color: #000000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            grid-column: 1 / -1;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            background: rgba(30, 30, 30, 0.6);
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            grid-column: auto;
        }

        .delete-btn:hover {
            background: #ff1a1a;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Panel Administratora</h1>

        <!-- 1. Pierwsza Drużyna -->
        <div class="section-box">
            <h2>Zarządzanie: Pierwsza Drużyna</h2>
            <form onsubmit="addPlayer(event, 'legion_first_team')">
                <input type="text" id="t-name" placeholder="Imię i nazwisko" required>
                <input type="text" id="t-position" placeholder="Pozycja (np. Napastnik)" required>
                <input type="number" id="t-age" placeholder="Wiek" required>
                <input type="number" id="t-number" placeholder="Numer na koszulce" required>
                <input type="number" id="t-matches" placeholder="Liczba meczów" required>
                <input type="number" id="t-goals" placeholder="Liczba goli" required>
                <button type="submit">Dodaj zawodnika do Pierwszej Drużyny</button>
            </form>
            <div class="item-list" id="list-legion_first_team"></div>
        </div>

        <!-- 2. Akademia -->
        <div class="section-box">
            <h2>Zarządzanie: Akademia</h2>
            <form onsubmit="addPlayer(event, 'legion_academy_players')">
                <input type="text" id="a-name" placeholder="Imię i nazwisko" required>
                <input type="text" id="a-position" placeholder="Pozycja" required>
                <input type="number" id="a-age" placeholder="Wiek" required>
                <input type="number" id="a-number" placeholder="Numer na koszulce" required>
                <input type="number" id="a-matches" placeholder="Liczba meczów" required>
                <input type="number" id="a-goals" placeholder="Liczba goli" required>
                <button type="submit">Dodaj zawodnika do Akademii</button>
            </form>
            <div class="item-list" id="list-legion_academy_players"></div>
        </div>

        <!-- 3. Artykuły (Aktualności) -->
        <div class="section-box">
            <h2>Zarządzanie: Artykuły</h2>
            <form onsubmit="addArticle(event)">
                <input type="text" id="art-title" placeholder="Tytuł artykułu" required style="grid-column: 1 / -1;">
                <input type="text" id="art-tags" placeholder="Tagi (np. Drużyna, Klub, Mecz)" required>
                <input type="text" id="art-date" placeholder="Data (np. 2026-03-29 14:00)" required>
                <textarea id="art-content" placeholder="Treść artykułu (HTML dozwolony)" required style="grid-column: 1 / -1; height: 100px;"></textarea>
                <button type="submit">Dodaj Artykuł</button>
            </form>
            <div class="item-list" id="list-articles"></div>
        </div>

        <!-- 4. Tabele i Ligi (Tagi) -->
        <div class="section-box">
            <h2>Zarządzanie Tabelami (Tagi / Ligi)</h2>
            <form onsubmit="addTableLeague(event)">
                <input type="text" id="league-tag" placeholder="Nazwa Ligi / Sezonu (Tag)" required style="grid-column: 1 / -1;">
                <textarea id="league-data" placeholder="Kod HTML tabeli lub dane wierszy" required style="grid-column: 1 / -1; height: 80px;"></textarea>
                <button type="submit">Zapisz Tabelę dla Ligi</button>
            </form>
            <div class="item-list" id="list-leagues"></div>
        </div>

        <!-- 5. Match Center (Mecze) -->
        <div class="section-box">
            <h2>Zarządzanie: Match Center (Wyniki iTerminarz)</h2>
            <form onsubmit="addMatch(event)">
                <input type="text" id="match-teams" placeholder="Mecz (np. Legion vs Rywal)" required>
                <input type="text" id="match-score" placeholder="Wynik (np. 2:1 lub zapowiedź)" required>
                <input type="text" id="match-date" placeholder="Data i godzina" required>
                <button type="submit">Dodaj Mecz</button>
            </form>
            <div class="item-list" id="list-matches"></div>
        </div>

    </div>

    <script>
        // Uniwersalne ładowanie i renderowanie
        function loadPanel() {
            renderPlayers('legion_first_team');
            renderPlayers('legion_academy_players');
            renderArticles();
            renderLeagues();
            renderMatches();
        }

        // --- ZAWODNICY ---
        function addPlayer(event, storageKey) {
            event.preventDefault();
            const prefix = storageKey === 'legion_first_team' ? 't-' : 'a-';
            
            const player = {
                id: 'p_' + Date.now(),
                name: document.getElementById(prefix + 'name').value,
                position: document.getElementById(prefix + 'position').value,
                age: document.getElementById(prefix + 'age').value,
                number: document.getElementById(prefix + 'number').value,
                matches: document.getElementById(prefix + 'matches').value,
                goals: document.getElementById(prefix + 'goals').value
            };

            let data = JSON.parse(localStorage.getItem(storageKey)) || [];
            data.push(player);
            localStorage.setItem(storageKey, JSON.stringify(data));

            event.target.reset();
            renderPlayers(storageKey);
        }

        function deletePlayer(storageKey, id) {
            let data = JSON.parse(localStorage.getItem(storageKey)) || [];
            data = data.filter(p => p.id !== id);
            localStorage.setItem(storageKey, JSON.stringify(data));
            renderPlayers(storageKey);
        }

        function renderPlayers(storageKey) {
            const container = document.getElementById('list-' + storageKey);
            if (!container) return;
            container.innerHTML = '';
            
            let data = JSON.parse(localStorage.getItem(storageKey)) || [];
            if (data.length === 0) {
                container.innerHTML = '<p style="color: #777; font-size: 0.9rem;">Brak zawodników.</p>';
                return;
            }

            data.forEach(p => {
                container.innerHTML += `
                    <div class="item-row">
                        <span><strong>${p.name}</strong> (${p.position}) - Nr ${p.number}</span>
                        <button class="delete-btn" onclick="deletePlayer('${storageKey}', '${p.id}')">Usuń</button>
                    </div>
                `;
            });
        }

        // --- ARTYKUŁY ---
        function addArticle(event) {
            event.preventDefault();
            const article = {
                id: 'art_' + Date.now(),
                title: document.getElementById('art-title').value,
                tags: document.getElementById('art-tags').value,
                date: document.getElementById('art-date').value,
                content: document.getElementById('art-content').value
            };

            let data = JSON.parse(localStorage.getItem('legion_news')) || [];
            data.push(article);
            localStorage.setItem('legion_news', JSON.stringify(data));

            event.target.reset();
            renderArticles();
        }

        function deleteArticle(id) {
            let data = JSON.parse(localStorage.getItem('legion_news')) || [];
            data = data.filter(a => a.id !== id);
            localStorage.setItem('legion_news', JSON.stringify(data));
            renderArticles();
        }

        function renderArticles() {
            const container = document.getElementById('list-articles');
            container.innerHTML = '';
            let data = JSON.parse(localStorage.getItem('legion_news')) || [];
            
            if (data.length === 0) {
                container.innerHTML = '<p style="color: #777; font-size: 0.9rem;">Brak artykułów.</p>';
                return;
            }

            data.forEach(a => {
                container.innerHTML += `
                    <div class="item-row">
                        <span><strong>${a.title}</strong> [${a.tags}]</span>
                        <button class="delete-btn" onclick="deleteArticle('${a.id}')">Usuń</button>
                    </div>
                `;
            });
        }

        // --- TABELE I LIGI (TAGI) ---
        function addTableLeague(event) {
            event.preventDefault();
            const tag = document.getElementById('league-tag').value.trim();
            const content = document.getElementById('league-data').value;

            let leagues = JSON.parse(localStorage.getItem('legion_leagues_tables')) || {};
            leagues[tag] = content;
            localStorage.setItem('legion_leagues_tables', JSON.stringify(leagues));

            event.target.reset();
            renderLeagues();
        }

        function deleteLeagueTable(tag) {
            let leagues = JSON.parse(localStorage.getItem('legion_leagues_tables')) || {};
            delete leagues[tag];
            localStorage.setItem('legion_leagues_tables', JSON.stringify(leagues));
            renderLeagues();
        }

        function renderLeagues() {
            const container = document.getElementById('list-leagues');
            container.innerHTML = '';
            let leagues = JSON.parse(localStorage.getItem('legion_leagues_tables')) || {};
            const keys = Object.keys(leagues);

            if (keys.length === 0) {
                container.innerHTML = '<p style="color: #777; font-size: 0.9rem;">Brak zapisanych tabel ligowych.</p>';
                return;
            }

            keys.forEach(tag => {
                container.innerHTML += `
                    <div class="item-row">
                        <span><strong>Liga / Tag:</strong> ${tag}</span>
                        <button class="delete-btn" onclick="deleteLeagueTable('${tag}')">Usuń Tabelę</button>
                    </div>
                `;
            });
        }

        // --- MATCH CENTER ---
        function addMatch(event) {
            event.preventDefault();
            const match = {
                id: 'm_' + Date.now(),
                teams: document.getElementById('match-teams').value,
                score: document.getElementById('match-score').value,
                date: document.getElementById('match-date').value
            };

            let data = JSON.parse(localStorage.getItem('legion_matches')) || [];
            data.push(match);
            localStorage.setItem('legion_matches', JSON.stringify(data));

            event.target.reset();
            renderMatches();
        }

        function deleteMatch(id) {
            let data = JSON.parse(localStorage.getItem('legion_matches')) || [];
            data = data.filter(m => m.id !== id);
            localStorage.setItem('legion_matches', JSON.stringify(data));
            renderMatches();
        }

        function renderMatches() {
            const container = document.getElementById('list-matches');
            container.innerHTML = '';
            let data = JSON.parse(localStorage.getItem('legion_matches')) || [];

            if (data.length === 0) {
                container.innerHTML = '<p style="color: #777; font-size: 0.9rem;">Brak zaplanowanych meczów / wyników.</p>';
                return;
            }

            data.forEach(m => {
                container.innerHTML += `
                    <div class="item-row">
                        <span><strong>${m.teams}</strong> (${m.score}) - ${m.date}</span>
                        <button class="delete-btn" onclick="deleteMatch('${m.id}')">Usuń</button>
                    </div>
                `;
            });
        }

        window.addEventListener('DOMContentLoaded', loadPanel);
    </script>
</body>
</html>
