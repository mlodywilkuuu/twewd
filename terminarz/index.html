<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminarz i Wyniki - Legion Białystok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060606;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animowane tło */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #040404, #0f0f0f, #1a1402);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Górny pasek nawigacyjny z efektem szkła */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* Menu hamburgerowe */
        .menu-dropdown {
            position: relative;
            display: inline-block;
        }

        .menu-toggle-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .menu-toggle-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .side-menu-dropdown {
            position: absolute;
            left: 0;
            top: calc(100% + 12px);
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 12px 0;
            min-width: 260px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown {
            left: auto;
            right: 0;
        }

        .menu-dropdown:hover .side-menu-dropdown,
        .side-menu-dropdown:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .side-menu-dropdown li {
            position: relative;
        }

        .side-menu-dropdown li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 22px;
            color: #dddddd;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        html[dir="rtl"] .side-menu-dropdown li a {
            border-left: none;
            border-right: 3px solid transparent;
        }

        .side-menu-dropdown li a:hover {
            background: rgba(255, 215, 0, 0.08);
            color: #ffd700;
            border-left-color: #ffd700;
            padding-left: 26px;
        }

        html[dir="rtl"] .side-menu-dropdown li a:hover {
            border-right-color: #ffd700;
            padding-left: 22px;
            padding-right: 26px;
        }

        .side-menu-dropdown li a::after {
            content: '›';
            font-size: 1.2rem;
            color: #666;
            transition: color 0.2s;
        }

        html[dir="rtl"] .side-menu-dropdown li a::after {
            content: '‹';
        }

        .side-menu-dropdown li a:hover::after {
            color: #ffd700;
        }

        /* Podmenu dla zakładki Klub */
        .submenu-club {
            position: absolute;
            left: 100%;
            top: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            list-style: none;
            padding: 10px 0;
            min-width: 200px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            opacity: 0;
            visibility: hidden;
            transform: translateX(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        html[dir="rtl"] .submenu-club {
            left: auto;
            right: 100%;
            transform: translateX(-10px);
        }

        .has-submenu:hover .submenu-club {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        /* Logo kierujące na główną */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-container img {
            height: 50px;
            width: auto;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        /* Przełącznik języków */
        .lang-dropdown {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .lang-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            list-style: none;
            padding: 8px 0;
            min-width: 150px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
            transition-delay: 0.25s;
        }

        .lang-dropdown:hover .lang-menu,
        .lang-menu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition-delay: 0s;
        }

        .lang-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            color: #cccccc;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .lang-menu li a:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        /* Główna treść strony */
        main {
            margin-top: 130px;
            padding: 20px 5% 80px 5%;
            max-width: 1300px;
            margin-left: auto;
            margin-right: auto;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 0 2px 15px rgba(255, 215, 0, 0.25);
        }

        /* Pasek filtrów / tagów rozgrywek */
        .filters-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .filter-btn {
            background: rgba(25, 25, 25, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #cccccc;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        /* Siatka 3 kolumny */
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            align-content: start;
        }

        @media (max-width: 1024px) {
            .schedule-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .schedule-grid {
                grid-template-columns: 1fr;
            }
        }

        .match-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.7), rgba(10, 10, 10, 0.8));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        .match-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .match-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.45);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .match-card:hover::before {
            opacity: 1;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #888888;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .match-league {
            color: #ffd700;
            font-weight: 700;
        }

        /* Układ drużyn: lewa strona (away), środek (score), prawa strona (home) */
        .match-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: center;
        }

        .team {
            flex: 1;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            word-break: break-word;
        }

        .team.away {
            text-align: left;
        }

        .team.home {
            text-align: right;
        }

        .score-box {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            min-width: 80px;
            text-align: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <header>
        <div class="header-left">
            <div class="menu-dropdown">
                <button class="menu-toggle-btn">☰</button>
                <ul class="side-menu-dropdown">
                    <li><a href="../aktualnosci" data-translate="news">Aktualności</a></li>
                    <li><a href="../druzyna" data-translate="team">Pierwsza drużyna</a></li>
                    <li><a href="../akademia" data-translate="academy">Akademia</a></li>
                    <li><a href="../terminarz" data-translate="schedule">Terminarz</a></li>
                    <li><a href="../tabela" data-translate="table">Tabela</a></li>
                    
                    <li class="has-submenu">
                        <a href="#" data-translate="club">Klub ›</a>
                        <ul class="submenu-club">
                            <li><a href="../historia" data-translate="history">Historia</a></li>
                            <li><a href="../o-klubie" data-translate="about">O klubie</a></li>
                            <li><a href="../ludzie-legionu" data-translate="people">Ludzie Legionu</a></li>
                        </ul>
                    </li>
                </ul>
            </div>

            <a href="../index.html" class="logo-container">
                <img src="../8216b4e4-580b-47c1-956b-318888b98a1f-removebg-preview.png" alt="Legion Białystok Logo">
            </a>
        </div>

        <div class="lang-dropdown">
            <button class="lang-btn" id="current-lang-btn">🇵🇱 Polski</button>
            <ul class="lang-menu">
                <li><a href="#" onclick="setLanguage('pl', '🇵🇱 Polski')">🇵🇱 Polski</a></li>
                <li><a href="#" onclick="setLanguage('en', '🇬🇧 English')">🇬🇧 English</a></li>
                <li><a href="#" onclick="setLanguage('es', '🇪🇸 Español')">🇪🇸 Español</a></li>
                <li><a href="#" onclick="setLanguage('ru', '🇷🇺 Русский')">🇷🇺 Русский</a></li>
                <li><a href="#" onclick="setLanguage('ar', '🇸🇦 العربية')">🇸🇦 العربية</a></li>
            </ul>
        </div>
    </header>

    <main>
        <h1 class="section-title" data-translate="section_title">Terminarz i Wyniki</h1>

        <!-- Panel tagów / filtrów rozgrywek -->
        <div class="filters-bar" id="filters-container">
            <button class="filter-btn active" onclick="filterByLeague('all')">Wszystkie mecze</button>
        </div>

        <div class="schedule-grid" id="schedule-container">
            <!-- Renderowane dynamicznie -->
        </div>
    </main>

    <script>
        const translations = {
            pl: {
                news: "Aktualności", team: "Pierwsza drużyna", academy: "Akademia", schedule: "Terminarz", table: "Tabela", club: "Klub ›", history: "Historia", about: "O klubie", people: "Ludzie Legionu",
                section_title: "Terminarz i Wyniki"
            },
            en: {
                news: "News", team: "First Team", academy: "Academy", schedule: "Schedule", table: "Standings", club: "Club ›", history: "History", about: "About Club", people: "Legion People",
                section_title: "Schedule & Results"
            },
            es: {
                news: "Noticias", team: "Primer Equipo", academy: "Academia", schedule: "Calendario", table: "Clasificación", club: "Club ›", history: "Historia", about: "Sobre el Club", people: "Gente del Legion",
                section_title: "Calendario y Resultados"
            },
            ru: {
                news: "Новости", team: "Первая команда", academy: "Академия", schedule: "Расписание", table: "Таблица", club: "Клуб ›", history: "История", about: "О клубе", people: "Люди Легиона",
                section_title: "Расписание и результаты"
            },
            ar: {
                news: "الأخبار", team: "الفريق الأول", academy: "الأكاديمية", schedule: "الجدول", table: "الترتيب", club: "النادي ›", history: "التاريخ", about: "عن النادي", people: "أعضاء النادي",
                section_title: "الجدول والنتائج"
            }
        };

        let currentLang = 'pl';
        let currentFilter = 'all';

        const defaultSchedule = [
            { id: "match-1", league: "II Liga BLS", date: "25.10.2026", homeTeam: "KS LIDER", awayTeam: "Legion Białystok", score: "9 : 2" },
            { id: "match-2", league: "II Liga BLS", date: "15.09.2026", homeTeam: "EXTreme team", awayTeam: "Legion Białystok", score: "5 : 0" }
        ];

        // Bezbłędny parser dat konwertujący tekst na unikalny znacznik liczbowy
        function parseDate(dateStr) {
            if (!dateStr) return 0;
            const cleanStr = dateStr.split(',')[0].trim();
            const parts = cleanStr.split('.');
            
            let day = parseInt(parts[0], 10) || 1;
            let month = parseInt(parts[1], 10) || 1;
            let year = parts[2] ? parseInt(parts[2], 10) : new Date().getFullYear();

            if (year < 100) year += 2000;

            return new Date(year, month - 1, day).getTime();
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            const filtersContainer = document.getElementById('filters-container');
            container.innerHTML = '';

            let data = JSON.parse(localStorage.getItem('legion_schedule')) || defaultSchedule;

            // Sortowanie malejące: od najnowszego (np. wrzesień 2026) do najstarszego (np. czerwiec 2026)
            data.sort((a, b) => parseDate(b.date) - parseDate(a.date));

            // Generowanie przycisków tagów
            const leagues = [...new Set(data.map(item => item.league || 'Mecz ligowy'))];
            
            let filtersHTML = `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="filterByLeague('all')">Wszystkie mecze</button>`;
            leagues.forEach(league => {
                filtersHTML += `<button class="filter-btn ${currentFilter === league ? 'active' : ''}" onclick="filterByLeague('${league}')">${league}</button>`;
            });
            filtersContainer.innerHTML = filtersHTML;

            // Filtrowanie meczów
            const filteredData = currentFilter === 'all' ? data : data.filter(item => (item.league || 'Mecz ligowy') === currentFilter);

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.id = item.id;

                card.innerHTML = `
                    <div class="match-header">
                        <span class="match-league">${item.league || 'Mecz ligowy'}</span>
                        <span class="match-date">${item.date}</span>
                    </div>
                    <div class="match-body">
                        <div class="team away">${item.awayTeam || 'Legion Białystok'}</div>
                        <div class="score-box">${item.score || 'VS'}</div>
                        <div class="team home">${item.homeTeam || 'Przeciwnik'}</div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function filterByLeague(leagueName) {
            currentFilter = leagueName;
            renderSchedule();
        }

        function setLanguage(lang, label) {
            currentLang = lang;
            document.getElementById('current-lang-btn').innerHTML = label;

            if (lang === 'ar') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }

            const elements = document.querySelectorAll('[data-translate]');
            elements.forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderSchedule();
        });
    </script>

</body>
</html>
